<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find a module, then its menu</title>
<style>
  body { margin: 0; background: #faf9f6; font-family: "Segoe UI", Arial, sans-serif; color: #1d1d1b; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 40px; }
  h1 { font-size: 30px; margin: 8px 0 6px; }
  h2 { font-size: 24px; margin: 34px 0 6px; }
  h2 span { display: inline-block; width: 36px; height: 36px; line-height: 36px; text-align: center;
            border-radius: 50%; background: #6b4fa0; color: #fff; margin-right: 10px; font-size: 20px; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; font-size: 16px;
            background: #fff; border: 1px solid #dddad2; border-radius: 12px; padding: 10px 16px; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .solid { width: 44px; border-top: 4px solid #444; }
  .dashed { width: 44px; border-top: 4px dashed #c0661b; }
  .sw { width: 22px; height: 22px; border-radius: 6px; }
  .caption { text-align: center; font-size: 22px; font-weight: 600; margin: 4px 0 0; color: #3a2f5c; }
  .card { background: #fff; border: 1px solid #dddad2; border-radius: 16px; padding: 8px; }
</style>
</head>
<body>
<main>

<!-- shared arrow heads and shapes -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b8a52"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0661b"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a877c"/></marker>
    <!-- small module icon: wrapper + menu -->
    <g id="mod">
      <rect width="48" height="36" rx="9" fill="#2f6f9f"/>
      <rect x="5" y="9" width="38" height="22" rx="5" fill="#fff"/>
      <rect x="24" y="11" width="16" height="18" rx="3" fill="#fff4cc" stroke="#c9a227" stroke-width="1.5"/>
    </g>
    <g id="modNew">
      <rect width="48" height="36" rx="9" fill="#eaf1f7" stroke="#2f6f9f" stroke-width="2" stroke-dasharray="5 3"/>
      <rect x="5" y="9" width="38" height="22" rx="5" fill="#fff"/>
      <rect x="24" y="11" width="16" height="18" rx="3" fill="#fffbea" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 3"/>

  </defs>
  <style>
    .wt { fill: #fff; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .menu { fill: #fff4cc; stroke: #c9a227; stroke-width: 2; }
    .mh { font-size: 13px; font-weight: 800; text-anchor: middle; fill: #7a5d00; }
    .mi { font-size: 13px; fill: #3a3000; }
    .sm { font-size: 13px; fill: #5f5e58; }
    .lb { font-size: 16px; font-weight: 600; fill: #1d1d1b; }
    .big { font-size: 22px; font-weight: 800; }
    .tagO { fill: #fdebd9; stroke: #c0661b; stroke-width: 2; stroke-dasharray: 6 4; }
    .num { fill: #6b4fa0; }
    .numT { fill: #fff; font-size: 16px; font-weight: 800; text-anchor: middle; }
    .oT { font-size: 14px; font-weight: 700; fill: #c0661b; }
    .pT { font-size: 14px; font-weight: 700; fill: #6b4fa0; }
    .gT { font-size: 14px; font-weight: 700; fill: #2a6b3c; }
    .kT { font-size: 13px; fill: #8a877c; }

</svg>

<h1>Find a module first, then open its menu</h1>

<div class="legend">
  <span><i class="solid"></i>Built today</span>
  <span><i class="dashed"></i>Proposal</span>
  <span><i class="sw" style="background:#2f6f9f"></i>Wrapper (ours only)</span>
  <span><i class="sw" style="background:#fff4cc;border:2px solid #c9a227"></i>Menu (MCP-like)</span>
  <span><i class="sw" style="background:#efeaf7;border:2px solid #6b4fa0"></i>Core</span>
  <span><i class="sw" style="background:#e4e3df;border:2px solid #aaa;opacity:.7"></i>Old way</span>
</div>

</svg>
<p class="caption">One shortcut to one module.</p>
</div>
