# Runs on every push and pull request. Tests that need a real `claude`
# process (marked `claude`) are skipped here; run them locally with `pytest -m claude`.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows: where it runs today. Linux: where it moves later (a server).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Every module's own packages (`packages` in its module.toml), so each module's tests can import
      # what it needs. The voice service tests never open a mic or load a model.
      - run: python scripts/install_module_packages.py
      - run: python -m pytest

  checks:
    name: Lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Docs HTML matches the Markdown
        # Fails if docs/**/*.md changed without rebuilding docs/html and docs/html-next-steps.
        run: |
          python scripts/build_docs.py
          git add -N docs/html docs/html-next-steps
          git diff --exit-code --stat docs/html docs/html-next-steps || {
            echo "::error::docs/html or docs/html-next-steps is out of date. Run: python scripts/build_docs.py and commit the result."
            exit 1
          }
