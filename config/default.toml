# Committed defaults. Put machine-specific overrides in config/local.toml
# (gitignored), or point ASSISTANT_CONFIG_DIR at another directory.

[modules]
# Which of the modules listed in src/assistant/__main__.py are active at startup.
# The others can be turned on at runtime (ActivateModule). Swap the orchestrator
# by changing this list.
# html_viewer and voice_notes are off at launch; turn them on with the core's modules.on.
# html_viewer also turns itself on when a page is opened (start_on_use in its section).
enabled = ["console_io", "agent_hub", "main_assistant", "talker", "temp_ui", "voice_in", "usage"]

# Per-module settings go in [modules.<module id>]. A module that ships its own defaults
# (module.toml in its folder: cv, job_search) needs a section here only to override them.
[modules.console_io]
prompt = "> "

[modules.talker]
model = "sonnet"
turn_timeout = 120.0      # seconds before a Talker turn is interrupted
context_exchanges = 6     # recent exchanges passed to the Main Assistant with a task
context_warning = 150000  # tokens: it tells you once when its own or the worker's context passes this
transcript = "talker.jsonl"  # every line to and from its claude, in the session's log folder
restart_note = ".claude/state/reset-instructions.md"  # reset instructions kept across a restart, used once
restart_timeout = 120.0   # seconds to wait for the worker's reset instructions before restarting anyway
# cwd = "..."             # the Talker's working directory (it has no tools)

[modules.main_assistant]
# For now it has the same access as Claude Code in this repo: the repo is its working
# folder (it loads CLAUDE.md and reads the docs), every built-in tool, every file.
workspace = "."           # its working folder: reads and writes allowed
tools = "default"         # every built-in tool, shell included
permission_mode = "acceptEdits"
# Standing permissions besides the workspace (paths relative to where the app runs).
read_dirs = ["."]
write_dirs = [".", ".claude/skills", ".claude/agents"]  # .claude/ is sensitive to claude: name these two explicitly
# Shell commands it may run without asking, with any arguments (run from the project folder).
# Read-only only: no git commit/push/reset/checkout, no deleting, no network, no installs.
allowed_commands = [
    '.\.venv\Scripts\python -m pytest',
    '.\.venv\Scripts\ruff check',
    '.\.venv\Scripts\python scripts\build_docs.py',
    'git status',
    'git diff',
    'git log',
    'git show',
    'Get-ChildItem',
    'Get-Content',
    'Select-String',
]
# Anything else (other shell commands, the rest of .claude/) is asked of you in the app:
# Allow / Deny in the temp UI, or by telling the Talker.
fresh_sessions = true     # each task starts in a new claude session, so its context holds only that task
max_handoffs = 3          # fresh sessions a task may hand off to (HANDOFF: <note>) before it asks you
context_reminder = 150000  # tokens: once past this, the worker is reminded to find a reset point and hand off (0 = off)
edit_note = true          # the edit hook's once-per-file batching note for the worker (false = off; the prompt line stays)
permission_prompts = true
permission_timeout = 600.0  # seconds; an unanswered request is denied
transcript = "main_assistant.jsonl"  # in the session's log folder
# model = "opus"          # default: your claude default

[modules.agent_hub]
coordinator = "main_assistant"  # the agent that hears the others' STATUS milestones, and holds the focus by default
max_extra_agents = 3      # big agents besides the coordinator that may work at once (the coordinator isn't counted)
# A free-agent pick (hub.start with no agent_id) skips an agent whose own config says
# `named_only = true` (in its [agent] section); it's started only when named.
# named_only = []         # optional fallback: more agent ids a free pick skips (e.g. in config/local.toml)
# start_only_by = { agent_id = ["caller", ...] }  # optional: only these callers may hub.start that agent
# door = true             # the agents' MCP door to the module menus (door_host, door_port = 0: any free port)

[modules.task_agents]
# Kinds of helper agent, one [modules.task_agents.agents.<kind>] section each; off at launch
# (turn on with modules.on). A helper is launched by name for one task (agents.launch, only with
# your yes on a card) and works in <kind workspace>/<name>. Keys here are defaults for every kind;
# a kind takes the same keys as [modules.main_assistant], plus `description`, `prompt` (its role,
# one or two sentences), and `autostart = true` to start one at launch (`instances` = N starts
# <kind>, <kind>_2, ..., each writing its own sub-folder of the workspace).
# The Hub's folder-clash check: two active agents never write the same folder, or one inside the
# other, except a module's own folder (src/assistant/modules/<id>) under a wider grant such as the
# Main Assistant's whole repo. A helper isn't a module's own agent (it gets no module folder), and
# a helper folder elsewhere in this repo would clash with the Main Assistant, so it lives outside.
permission_mode = "acceptEdits"
permission_timeout = 600.0
chrome = true             # every kind gets the Claude in Chrome tools (on its access card); a kind may set false

[modules.task_agents.agents.helper]
description = "A small helper: reads and writes notes in its own folder"
prompt = "You do small, self-contained jobs in your own folder and report what you made."
workspace = "../assistant-helper"
tools = "Read,Write,Edit,Glob,Grep"
transcript = "helper.jsonl"

[modules.task_agents.agents.rezi]
# The Rezi helper (docs/next-steps/rezi-module.md): tailors resumes in Rezi for postings the job
# agent hands it. Works outside C:/Chang/Jobs/CV (the job agent writes all of it, so a folder
# inside would clash with it); reads the job project and this repo's docs.
description = "Rezi helper: tailors a resume in Rezi for one job posting, through the rezi module's menu"
prompt = "You tailor resumes in Rezi, one job posting per task. You reach Rezi only through the rezi.* items on the module door's rezi menu, never any other way; until that module exists, read docs/next-steps/rezi-module.md and research. Never change the base resume: each job gets a new resume. Report the new resume's name."
workspace = "C:/Chang/Jobs/rezi"
read_dirs = ["C:/Chang/Jobs/CV", "C:/Chang/Git_projects/AI_Assistant/docs"]
tools = "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,PowerShell"
transcript = "rezi.jsonl"

[modules.temp_ui]
# TEMPORARY two-pane UI (Main Assistant | Talker) at http://127.0.0.1:8765/,
# until the UI handler and its configurations are designed.
port = 8765
window = "app"            # "app" (own window, via Edge), "browser" (a tab), or "none"

[modules.html_viewer]
# The HTML viewer: its own program and window at http://127.0.0.1:8766/, started on the
# first file shown and stopped with the app (one you started yourself is left running).
host = "127.0.0.1"
port = 8766
window = "app"            # "app" (own window, via Edge), "browser" (a tab), or "none"
# Folders built from Markdown by scripts/build_docs.py: saving there writes text edits back to the
# page's Markdown source too, and warns about any edit that can't be (a rebuild would overwrite it).
generated = ["docs/html", "docs/html-next-steps"]
start_timeout = 10.0      # seconds to wait for the viewer to answer after starting it
start_on_use = true       # opening a page (SHOW, Open in viewer, viewer.*) turns this module on if it's off

[modules.voice_in]
# Voice input (on: the temp UI's mic button sends it StartListening / StopListening): launches the voice service
# (its own app, `python -m voice_service`) on the first mic click and quits it with the app
# (one you started yourself is left running). The service's own settings, such as how long it
# waits for a dropped mic, are in config/voice_service.toml.
host = "127.0.0.1"
port = 8767
start_timeout = 20.0      # seconds for the service to answer /health after launching it
service_config = ""       # optional path passed to the service as --config
reply_timeout = 10.0      # seconds to wait for the service's `started` after start, and its final text after stop
live_text = true          # false = the text appears when you stop, even with a live engine (whisper is always on send)
final_timeout_on_send = 90.0  # seconds to wait for the final when the text comes on send (whisper decodes it all at the stop)
cleanup = true            # sentence case for the engine's all-caps text, one end mark per final; cased text (whisper) keeps its case (false = raw text)
# Words the cleanup writes back as given instead of lowercasing; set your own list in config/local.toml.
terms = ["Isaac Sim", "USD", "glTF", "Unity", "Unitree", "Zipformer"]

[modules.voice_notes]
# Voice notes v1: a page at http://127.0.0.1:8770/ with Record / Stop, a live line, and Copy. The words
# go only to the page (kept in its local storage), never to the Talker. Needs voice_in on.
# The second press wins: Record cancels the chat mic's recording, and the other way round.
port = 8770
window = "app"            # "app" (own window, via Edge), "browser" (a tab), or "none"

[core]
command_timeout = 30.0        # seconds; default for every command
module_stop_timeout = 5.0     # seconds each module gets to stop
event_queue_size = 100        # per subscriber; events beyond this are dropped
event_handler_timeout = 10.0  # seconds before a stuck event handler is cancelled
reload_idle_timeout = 300.0   # seconds a ReloadModule waits for a busy module (replying, mid-task)

[core.permissions]
# The permissions handler (part of the core, always on). Every key is optional:
# grants_file = "data/permissions.toml"  # the saved grants, in the protected zone (relative to the repo)
reviewer = "main_assistant"              # reviews an access list before its card shows ("" for none)
# review_timeout = 90.0                  # seconds; past it, or when the reviewer is busy, the card says "not reviewed"
# answer_timeout = 600.0                 # seconds a card waits for your answer; then it counts as Deny
you = ["temp_ui"]                        # callers that are you clicking; an agent's grant or revoke shows you a card

[core.command_timeouts]
# Per command type, by class name, e.g.
# InvokeTool = 60.0
StartListening = 30.0         # may launch the voice service and wait for its model
StopListening = 120.0         # above voice_in's final_timeout_on_send: whisper decodes the whole message at the stop
ReloadModule = 330.0          # may wait up to reload_idle_timeout for a busy module, then swap
AddModule = 60.0

[logging]
# Each launch logs into its own folder, dir/<start time>_<theme of your first question>/,
# holding this file and every module's `transcript` (see LogSession in infra/log.py).
# The folder is created at your first message; a launch without one leaves none
# (its warnings and errors go to dir/no-chat.log).
dir = "logs"
level = "INFO"
file = "assistant.log"
stderr = false  # keep false while console_io is enabled
