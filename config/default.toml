# The core's committed settings. Which modules are on is in config/modules.toml.
# Your own choices for one module go in config/<module id>.toml (gitignored; top-level keys are
# that module's settings, no [modules.<id>] header), and config/<id>.local.toml over that.
# config/local.toml (gitignored) still overrides everything, last. Or point ASSISTANT_CONFIG_DIR
# at another directory. The load order is in load_config (src/assistant/infra/config.py).

[modules]
# Empty on purpose. Every module ships its own defaults in the module.toml in its folder
# (src/assistant/modules/<id>/module.toml), with its `needs` and `packages`; config/<id>.toml,
# then config/<id>.local.toml, then a [modules.<id>] section in config/local.toml override them, key by key.
# So this file holds no module's defaults and no on/off list, only the core's settings below.
# The Talker's, main_assistant's, agent_hub's and task_agents' defaults (task_agents' kinds of helper
# included) are in each module's module.toml; so are console_io's (prompt) and temp_ui's (port 8765,
# window). usage, assistant_view and echo_orchestrator have none.
# html_viewer's defaults (port 8766, window, generated folders, start_on_use) are in its module.toml.
# voice_in's defaults (port 8767, timeouts, cleanup, terms) are in its module.toml; the voice
# service's own settings in voice_in's app/voice_service/voice_service.toml.
# voice_notes' defaults (port 8770, window; needs voice_in) are in its module.toml.

[core]
command_timeout = 30.0        # seconds; default for every command
module_stop_timeout = 5.0     # seconds each module gets to stop
event_queue_size = 100        # per subscriber; events beyond this are dropped
event_handler_timeout = 10.0  # seconds before a stuck event handler is cancelled
reload_idle_timeout = 300.0   # seconds a ReloadModule waits for a busy module (replying, mid-task)
generated_dir = "generated"   # the core's generated files (module list, directory, dependencies); relative to the repo; gitignored; "" for none
# More folders holding module folders, outside the repo (module layout step 2): absolute paths, each holding
# <id>/ folders directly (e.g. "C:/AddOns" with cv/ inside). Searched after the repo's src/assistant/modules;
# an id in two folders stops the startup. Empty: only the repo's folder, as before. Yours go in config/local.toml.
module_folders = []

[core.door]
# The agents' one MCP door to the module menus, hosted by the core (opened before any module starts).
enabled = true                # false: no agent gets the door
host = "127.0.0.1"            # loopback only
port = 0                      # 0: any free port

[core.permissions]
# The permissions handler (part of the core, always on). Every key is optional:
# grants_file = "config/permissions.toml"  # the saved grants: yours, gitignored, protected (relative to the repo);
#                                          # copied once from the old data/permissions.toml if missing
reviewer = "main_assistant"              # reviews an access list before its card shows ("" for none)
# review_timeout = 90.0                  # seconds; past it, or when the reviewer is busy, the card says "not reviewed"
# answer_timeout = 600.0                 # seconds a card waits for your answer; then it counts as Deny
you = ["temp_ui"]                        # callers that are you clicking; an agent's grant or revoke shows you a card
relays = ["talker"]                      # modules that relay your answer to a card (ALLOW / DENY); never your Auto

[core.command_timeouts]
# Per command type, by class name, e.g.
# InvokeTool = 60.0
StartListening = 30.0         # may launch the voice service and wait for its model
StopListening = 120.0         # above voice_in's final_timeout_on_send: whisper decodes the whole message at the stop
ReloadModule = 330.0          # may wait up to reload_idle_timeout for a busy module, then swap
AddModule = 60.0

[logging]
# Each launch logs into its own folder, dir/<start time>_<theme of your first question>/,
# holding this file and every module's `transcript` (see LogSession in infra/log.py).
# The folder is created at your first message; a launch without one leaves none
# (its warnings and errors go to dir/no-chat.log).
dir = "logs"
level = "INFO"
file = "assistant.log"
stderr = false  # keep false while console_io is enabled
