<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --border: #e3e1db; --text: #1d1d1b; --muted: #77756e;
  --accent: #6b4fa0; --accent-text: #ffffff; --bubble: #efedf5; --tool: #5f7f6a; --task: #2f6f9f;
  --idle: #8a877c; --working: #2e8b57; --waiting: #c58a1a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --border: #33322f; --text: #ebe9e4; --muted: #9a978e;
    --accent: #8f72c9; --accent-text: #ffffff; --bubble: #2a2833; --tool: #8fb79b; --task: #6fa8d6;
    --idle: #77756e; --working: #4cc38a; --waiting: #e0a93a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
header h1 { font-size: 15px; font-weight: 600; margin: 0; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; }
.conn { margin-left: auto; font-size: 12px; color: var(--muted); }
.ghost {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text);
  font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
}
.ghost:hover { background: var(--bubble); }
.ghost svg { width: 14px; height: 14px; }
.perm {
  max-width: 85%; margin: 10px 0; padding: 10px 12px; border: 1px solid var(--waiting); border-radius: 10px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
.perm .what { font: 12.5px/1.5 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; margin: 4px 0 8px; }
.perm.risky .what { font: inherit; white-space: pre-wrap; }
.perm .title { font-weight: 600; color: var(--waiting); }
.perm .actions { display: flex; gap: 8px; align-items: center; }
.perm .actions button { height: 30px; }
.perm .deny { background: transparent; color: var(--text); border: 1px solid var(--border); }
.perm.done { border-color: var(--border); }
.perm.done .title { color: var(--muted); }
.perm .note { font-size: 12px; color: var(--muted); }
/* The permissions handler's access card: tick boxes, warnings, the fixed rules. */
.perm.access label { display: flex; gap: 6px; align-items: baseline; font: 12.5px/1.5 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.perm.access .warn { font-size: 12.5px; color: var(--waiting); margin: 2px 0; }
.perm.access .warn.review { color: var(--text); }
.perm.access .warn.refused { text-decoration: line-through; color: var(--muted); }
.perm.access details { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.opens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.opens .ghost { height: 26px; background: var(--panel); }
.opens .note { font-size: 12px; color: var(--muted); align-self: center; }
main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane + .pane { border-left: 1px solid var(--border); }
.pane-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px;
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
}
.pill { display: inline-flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
.pill[data-state="working"] .dot { background: var(--working); animation: pulse 1.2s infinite; }
.pill[data-state="waiting"] .dot { background: var(--waiting); }
@keyframes pulse { 50% { opacity: .35; } }
.usage { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.usage b { font-weight: 600; color: var(--text); margin-right: 4px; }
.usage .ctx[data-level="high"] { color: var(--waiting); font-weight: 600; }
/* THROWAWAY usage dropdown: the total button and its list, one row per agent, sub-agents indented. */
.usage { align-items: center; }
.tally-wrap { position: relative; }
.tally { height: 24px; padding: 0 8px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tally-menu {
  position: absolute; top: 28px; left: 0; z-index: 10; min-width: 300px; padding: 6px 0; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,.15);
}
.tally-menu .row { display: flex; gap: 12px; padding: 3px 12px; white-space: nowrap; }
.tally-menu .row .name { flex: 1; }
.tally-menu .row.sub { padding-left: 28px; color: var(--muted); }
.tally-menu .row.closed { color: var(--muted); opacity: 0.6; }
.tally-menu .row.sum { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 6px; font-weight: 600; }
.tally-menu .none { padding: 3px 12px; color: var(--muted); }
.pane-head .ghost { margin-left: auto; height: 24px; padding: 0 8px; text-transform: none; letter-spacing: 0; }
/* The permission mode toggle (a stand-in) and the amber head while Auto is on. */
.mode { display: inline-flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-weight: 500; }
.mode .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.mode .seg button {
  height: 22px; padding: 0 8px; border-radius: 0; background: transparent; color: var(--text);
  font-size: 12px; font-weight: 500;
}
.mode .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.pane-head.auto { background: var(--waiting); color: #1d1d1b; }
.pane-head.auto .mode .seg { border-color: #1d1d1b; }
.pane-head.auto .mode .seg button[aria-pressed="true"] { background: #1d1d1b; color: #ffffff; }
.pane-head.auto .ghost { color: #1d1d1b; border-color: #1d1d1b; }
.tag.auto { color: #1d1d1b; background: var(--waiting); border-color: var(--waiting); text-transform: none; letter-spacing: 0; }
/* One tab per big agent (shown with two or more): its state dot, a ! while it holds a question,
   the focused one filled. The Main Assistant's tab has its own colour. A click moves the focus. */
/* The Talker pane's header names the pair (Talker · agent) in its tab's colour. */
.pair { padding: 1px 8px; border-radius: 6px; background: var(--accent); color: #ffffff; text-transform: none; letter-spacing: 0; }
.pair.helper { background: var(--task); }
.pair:empty { display: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 6px; }
.tabs:empty { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 12px; font-weight: 500;
}
.tab.main { border-color: var(--accent); color: var(--accent); }
.tab[aria-selected="true"] { background: var(--task); border-color: var(--task); color: #ffffff; cursor: default; }
.tab.main[aria-selected="true"] { background: var(--accent); border-color: var(--accent); }
.tab[data-state="working"] .dot { background: var(--working); animation: pulse 1.2s infinite; }
.tab[data-state="waiting"] .dot { background: var(--waiting); }
.tab .bang {
  display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%;
  background: var(--waiting); color: #1d1d1b; font-size: 11px; font-weight: 700;
}
.feed { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
.msg { max-width: 85%; margin: 8px 0; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.talker { background: var(--bubble); border-bottom-left-radius: 4px; }
.msg.you { background: var(--accent); color: var(--accent-text); margin-left: auto; border-bottom-right-radius: 4px; }
.msg.note { max-width: none; margin: 6px 0; padding: 0; font-size: 12px; color: var(--muted); text-align: center; }
.time { display: block; font-size: 11px; opacity: .6; margin-top: 2px; }
.msg.note .time { display: inline; margin-left: 6px; }
.log { font: 12.5px/1.55 ui-monospace, Consolas, monospace; }
.line { padding: 3px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.line .t { color: var(--muted); margin-right: 8px; }
.line.tool { color: var(--tool); }
.line.task { color: var(--task); font-weight: 600; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
#snips { display: none; gap: 8px; padding: 8px 16px 0; border-top: 1px solid var(--border); background: var(--panel); }
#snips.show { display: flex; }
.sent-snips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; white-space: normal; }
#snips + form { border-top: 0; }
.snip { position: relative; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); max-width: 140px; }
.snip img { width: 120px; height: 72px; object-fit: cover; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.snip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snip .drop {
  position: absolute; top: -6px; right: 10px; width: 20px; height: 20px; padding: 0; border-radius: 50%;
  font-size: 13px; line-height: 20px; background: var(--text); color: var(--panel);
}
/* The mic button and the grey live line above the input (voice_in). */
#voice { display: none; padding: 8px 16px 0; border-top: 1px solid var(--border); background: var(--panel);
  color: var(--muted); font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; }
#voice.show { display: block; }
#voice[data-state="dropped"] { color: var(--waiting); font-style: normal; font-weight: 500; }
#voice[data-state="failed"], #voice[data-state="idle"] { font-style: normal; }
#voice.show + #snips, #voice.show + #snips + form, #snips.show + form { border-top: 0; }
/* Two passes: the settled start of the line (cleaned) in normal text; the rough rest stays dimmed. */
#voice .settled { color: var(--text); font-style: normal; }
.mic[data-state="finishing"] { animation: pulse 1.2s infinite; cursor: progress; }
.mic { width: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--text); border: 1px solid var(--border); }
.mic svg { width: 18px; height: 18px; }
.mic .slash { display: none; }
.mic[data-state="starting"] { animation: pulse 1.2s infinite; cursor: progress; }
.mic[data-state="listening"] { background: #c43d3d; border-color: #c43d3d; color: #ffffff; }
.mic[data-state="dropped"] { background: var(--waiting); border-color: var(--waiting); color: #1d1d1b; }
.mic[data-state="dropped"] .slash { display: inline; }
.mic[data-state="failed"] { border-color: var(--waiting); }
/* Unavailable (the voice module is off or reloading, or the voice app isn't running): crossed out. */
.mic.off { color: var(--muted); border-color: var(--border); background: transparent; }
.mic.off .slash { display: inline; }
.mic:disabled { cursor: not-allowed; opacity: .6; }
/* The clear button: only while the mic is on. */
.mic-clear { width: 32px; padding: 0; color: var(--muted); }
.mic-clear[hidden] { display: none; }
/* The typing box's drag handle (its top edge): drag to set the box's height, one size for every tab. */
#grip { flex: none; height: 9px; cursor: ns-resize; touch-action: none; border-top: 1px solid var(--border);
  background: var(--panel); display: flex; align-items: center; justify-content: center; }
#grip::before { content: ""; width: 36px; height: 3px; border-radius: 2px; background: var(--border); }
#grip:hover::before, #grip.drag::before { background: var(--accent); }
#grip ~ #voice, #grip ~ #snips, #grip ~ form { border-top: 0; }
form { align-items: flex-end; }
form > button { height: 40px; flex: none; }
textarea {
  flex: 1; resize: none; height: 40px; min-height: 40px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button {
  border: 0; border-radius: 10px; padding: 0 16px; background: var(--accent); color: var(--accent-text);
  font: inherit; font-weight: 600; cursor: pointer;
}
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>
<header>
  <h1>Assistant</h1><span class="tag">temp UI</span>
  <span class="usage">
    <!-- THROWAWAY usage dropdown: the total since launch; a click lists every agent (see "usage dropdown" below). -->
    <span class="tally-wrap">
      <button class="ghost tally" id="tally-btn" type="button" aria-expanded="false"
        title="Every agent's tokens since the app started: every call counted, so cached context counts again on each call (work done, not new text). Click for each agent">Total not started ▾</button>
      <div class="tally-menu" id="tally-menu" hidden></div>
    </span>
    <span id="usage-worker" title="This tab's worker: the size of its latest call, about what each next call resends"><b>Worker</b>context 0k</span>
    <span id="usage-talker" title="This tab's Talker: the size of its latest call, about what each next call resends"><b>Talker</b>context 0k</span>
    <span id="usage-pair" title="This tab's worker and Talker, with their sub-agents: tokens since the app started. Every call counted, so cached context counts again on each call (work done, not new text)"><b>Used</b>0k</span>
  </span>
  <span class="conn" id="conn">connecting…</span>
  <button class="ghost" id="logs" title="Open the logs folder in Explorer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Logs
  </button>
</header>
<main>
  <section class="pane">
    <div class="pane-head">Main Assistant
      <span class="pill" id="state" data-state="idle"><span class="dot"></span><span id="state-text">idle</span></span>
      <span class="tag auto" id="worker-mode" hidden>AUTO</span>
      <button class="ghost" data-reset="worker" title="Start the worker fresh (mid-task it writes a handoff first)">Reset</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Big agents"></div>
    <div class="feed log" id="worker"><div class="empty">No activity yet.</div></div>
  </section>
  <section class="pane">
    <div class="pane-head" id="talker-head">Talker <span class="pair" id="talker-pair" title="Each agent's tab has its own chat"></span>
      <!-- STAND-IN: the permission mode toggle lives here until the control panel / UI handler
           exist. It only sends SetPermissionMode and shows PermissionModeChanged, so they reuse both. -->
      <span class="mode" id="mode" title="Stand-in (temp UI): sets what this tab's agent may do. Manual: it asks before tools outside its standing rules. Auto: full permissions, no prompts, git push blocked. Manual at every launch.">
        <span id="mode-label">Main Assistant: Manual</span>
        <span class="seg"><button data-mode="manual" aria-pressed="true">Manual</button><button data-mode="auto" aria-pressed="false">Auto</button></span>
      </span>
      <button class="ghost" data-reset="talker" title="Start the Talker fresh (it keeps the last few exchanges)">Reset</button>
    </div>
    <div class="feed" id="talker"><div class="empty">Say something to start.</div></div>
    <div id="grip" title="Drag to make the typing box taller or shorter (double-click: back to one line)"></div>
    <div id="voice" data-state="idle"></div>
    <div id="snips" title="Snips from the HTML viewer: sent with your next message"></div>
    <form id="say">
      <textarea id="text" placeholder="Talk to the assistant (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
      <button type="button" class="mic-clear" id="mic-clear" hidden title="Clear: throw away what you said so far (nothing is sent) and keep listening">✕</button>
      <button type="button" class="mic" id="mic" data-state="idle" title="Click to talk, click again to send what you said">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M3 3l18 18"/></svg>
      </button>
      <button>Send</button>
    </form>
  </section>
</main>
<script>
const panes = { talker: document.getElementById("talker"), worker: document.getElementById("worker") };
const stateEl = document.getElementById("state"), stateText = document.getElementById("state-text");
const conn = document.getElementById("conn");

function atBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 40; }

// Scroll memory per tab (docs/next-steps/temp-ui-tab-scroll.md). Both panes hold every tab's
// lines and a switch only hides the others, so each tab's place is saved before the switch
// and set again after the new lines are laid out, then once more a frame later. A pane you'd
// scrolled up in keeps its block: the shown block nearest the middle of the view, and its offset.
const scrollMemory = {};                       // tab id -> { talker: {pinned, top, anchor, offset}, worker: {...} }
const stuck = { talker: true, worker: true };  // the shown tab's panes: following the bottom?
let settling = 0;                              // while > 0, scroll events are ours, not the user's
for (const [name, pane] of Object.entries(panes)) {
  pane.addEventListener("scroll", () => { if (!settling) stuck[name] = atBottom(pane); });
  pane.addEventListener("load", () => { if (stuck[name]) pane.scrollTop = pane.scrollHeight; }, true);  // a late image
}
function middleLine(pane) {  // the shown block nearest the middle of the view, and its top's offset from the pane's top
  const box = pane.getBoundingClientRect(), mid = box.top + box.height / 2;
  let best = null, bestGap = Infinity;
  for (const el of pane.children) {
    if (el.hidden) continue;
    const r = el.getBoundingClientRect();
    const gap = r.top > mid ? r.top - mid : r.bottom < mid ? mid - r.bottom : 0;  // 0: it spans the middle
    if (gap < bestGap) { best = { anchor: el, offset: r.top - box.top }; bestGap = gap; }
    if (gap === 0 || r.top > mid) break;  // the children run top to bottom
  }
  return best || { anchor: null, offset: 0 };
}
function saveScroll(tab) {
  scrollMemory[tab] = {};
  for (const [name, pane] of Object.entries(panes)) {
    const pinned = stuck[name] || atBottom(pane);
    scrollMemory[tab][name] = { pinned, top: pane.scrollTop, ...(pinned ? {} : middleLine(pane)) };
  }
}
function restoreScroll(tab, changed) {
  const saved = changed ? scrollMemory[tab] || {} : {};
  for (const name of Object.keys(panes)) if (changed) stuck[name] = !saved[name] || saved[name].pinned;
  const apply = () => {
    for (const [name, pane] of Object.entries(panes)) {
      if (stuck[name]) pane.scrollTop = pane.scrollHeight;
      else if (changed) {
        const { anchor, offset, top } = saved[name];
        if (anchor && anchor.parentNode === pane && !anchor.hidden) {
          pane.scrollTop += anchor.getBoundingClientRect().top - pane.getBoundingClientRect().top - offset;
        } else pane.scrollTop = top;  // that line is gone (a rebuilt pane): the old offset
      }
    }
  };
  settling++;
  apply();
  requestAnimationFrame(() => { apply(); requestAnimationFrame(() => { apply(); settling--; }); });
}

function post(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

function settle(card, text, title = "Permission") {
  card.classList.add("done");
  card.querySelector(".title").textContent = title;
  card.querySelector(".actions").replaceChildren(Object.assign(document.createElement("span"), { className: "note", textContent: text }));
}

function permissionCard(item) {
  const card = document.createElement("div");
  card.className = "perm";
  card.dataset.task = item.task_id;
  const who = item.agent ? label(item.agent) : "The assistant";
  const title = Object.assign(document.createElement("div"), { className: "title", textContent: who + " asks permission" });
  const what = Object.assign(document.createElement("div"), { className: "what", textContent: item.text });
  const actions = Object.assign(document.createElement("div"), { className: "actions" });
  for (const [label, allow] of [["Allow", true], ["Deny", false]]) {
    const b = Object.assign(document.createElement("button"), { textContent: label, className: allow ? "" : "deny" });
    b.onclick = async () => {
      actions.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const r = await post("/permission", { task_id: item.task_id, allow })
        .then((r) => r.json()).catch(() => ({ ok: false, error: "no connection" }));
      if (!r.ok) settle(card, "Couldn't answer: " + (r.error || "unknown error"));
    };
    actions.append(b);
  }
  card.append(title, what, actions);
  return card;
}

// The permissions handler's card: a module's access list (one tick box per item; the working
// folder comes with the agent), its warnings and the review, or an agent's grant / revoke.
function accessCard(item) {
  const c = item.card, card = document.createElement("div");
  card.className = "perm access";
  card.dataset.request = item.request_id;
  const who = c.subject && c.subject !== c.module_id ? `${c.module_id} → ${c.subject}` : c.module_id;
  const head = c.action === "access" ? `${who} asks for its access`
    : c.action === "confirm" ? `${c.caller || who} asks you to confirm`
    : c.action === "message" ? `${c.caller} wants to message ${c.items.map((i) => i.target).join(", ")}`
    : `${c.caller} asks to ${c.action} access for ${who}`;
  const title = Object.assign(document.createElement("div"), { className: "title", textContent: head });
  const body = [title];
  if (c.reason) body.push(Object.assign(document.createElement("div"), { className: "note", textContent: c.reason }));
  const boxes = [];
  for (const i of c.items) {
    const row = document.createElement("label"), box = document.createElement("input");
    box.type = "checkbox"; box.checked = true; box.value = i.key;
    box.disabled = !i.trimmable || c.action !== "access";
    if (!box.disabled) boxes.push(box);
    row.append(box, i.label);
    body.push(row);
  }
  for (const n of c.notes) body.push(Object.assign(document.createElement("div"), {
    className: "warn " + n.source, textContent: (n.source === "review" ? "Review: " : n.source === "refused" ? "Refused: " : "⚠ ") + n.text }));
  if (c.reviewed === false) body.push(Object.assign(document.createElement("div"), { className: "warn", textContent: "Not reviewed (the Main Assistant was busy or didn't answer in time)" }));
  if (c.rules.length) {
    const d = document.createElement("details");
    d.append(Object.assign(document.createElement("summary"), { textContent: "Rules that always hold" }), ...c.rules.map((r) => Object.assign(document.createElement("div"), { textContent: r })));
    body.push(d);
  }
  const actions = Object.assign(document.createElement("div"), { className: "actions" });
  // [label, allow, remember]: a message card has Allow once · Always allow · Deny.
  const buttons = c.action === "message" ? [["Allow once", true, false], ["Always allow", true, true], ["Deny", false, false]]
    : [[c.action === "access" ? "Allow ticked" : "Allow", true, true], ["Deny", false, false]];
  for (const [label, allow, remember] of buttons) {
    const b = Object.assign(document.createElement("button"), { textContent: label, className: allow ? "" : "deny" });
    b.onclick = async () => {
      actions.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const keep = c.action === "access" ? [...c.items.filter((i) => !i.trimmable).map((i) => i.key), ...boxes.filter((x) => x.checked).map((x) => x.value)] : null;
      const r = await post("/access-answer", { request_id: item.request_id, allow, keep, remember })
        .then((r) => r.json()).catch(() => ({ ok: false, error: "no connection" }));
      if (!r.ok) settle(card, "Couldn't answer: " + (r.error || "unknown error"), "Access");
    };
    actions.append(b);
  }
  card.append(...body, actions);
  return card;
}

// Auto only: the Main Assistant paused before a risky step (an item of kind "risky": the Hub
// typed the question, the module sends the text without its "Risky:"). The buttons
// send the same answer as typing it would; answering in words works too.
function riskyCard(item) {
  const card = document.createElement("div");
  card.className = "perm risky";
  card.dataset.task = item.task_id;
  const title = Object.assign(document.createElement("div"), { className: "title", textContent: "⚠ Risky step, paused" });
  const what = Object.assign(document.createElement("div"), { className: "what", textContent: item.text });
  const actions = Object.assign(document.createElement("div"), { className: "actions" });
  for (const [label, answer] of [["Go ahead", "Go ahead"], ["Don't", "Don't do it"]]) {
    const b = Object.assign(document.createElement("button"), { textContent: label, className: label === "Go ahead" ? "" : "deny" });
    b.onclick = async () => {
      actions.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const r = await post("/say", { text: answer, agent: item.agent || focused() }).catch(() => null);
      settle(card, r && r.ok ? "You said: " + answer : "Couldn't send: no connection", "Risky step");
    };
    actions.append(b);
  }
  card.append(title, what, actions);
  return card;
}

// Each agent's permission mode (STAND-IN toggle): the button sets and shows the focused tab's
// agent. Auto takes a confirm; Manual is one click.
const modeBox = document.getElementById("mode"), modeLabel = document.getElementById("mode-label");
const talkerHead = document.getElementById("talker-head"), workerMode = document.getElementById("worker-mode");
const modes = {};  // agent id -> its last mode item; Manual until one comes
const autoWarning = (name) => "Switch " + (name === "Main Assistant" ? "the Main Assistant" : name) + " to Auto?\n\n" +
  "Auto gives it full permissions for every tool, with no permission prompts, except git push, which stays blocked (you push yourself).\n\n" +
  "It pauses to ask before risky steps on its own judgment only. This is not a guarantee.";

function showMode(item) {
  modes[item.agent || agents.coordinator] = item;
  renderMode();
}

function renderMode() {  // the focused tab's agent; called on a mode item and on every tab switch
  const item = modes[focused()] || { mode: "manual", applies: "now" };
  const auto = item.mode === "auto";
  const later = item.applies === "next_task" ? " (from the next task)" : "";
  talkerHead.classList.toggle("auto", auto);
  modeLabel.textContent = label(focused()) + (auto ? ": AUTO, no permission prompts" : ": Manual") + later;
  modeBox.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === item.mode)));
  workerMode.hidden = !auto;
  workerMode.textContent = "AUTO, no permission prompts" + later;
}

modeBox.querySelectorAll("button").forEach((b) => {
  b.onclick = async () => {
    if (b.getAttribute("aria-pressed") === "true") return;
    const agent = focused();  // the tab you pressed it in
    if (b.dataset.mode === "auto" && !confirm(autoWarning(label(agent)))) return;
    const r = await post("/permission-mode", { mode: b.dataset.mode, agent })
      .then((r) => r.json()).catch(() => ({ ok: false, error: "no connection" }));
    if (!r.ok) alert("Couldn't switch the permission mode: " + (r.error || "unknown error"));
  };
});

// An HTML file path in a Talker message gets an "Open in viewer" button (html_viewer, via InvokeTool).
const HTML_PATH = /(?:[A-Za-z]:[\\/]|[\\/])?(?:[\w.\-]+[\\/])*[\w.\-]+\.html?\b/gi;

function openButtons(text) {
  const paths = [...new Set(text.match(HTML_PATH) || [])];
  if (!paths.length) return null;
  const row = Object.assign(document.createElement("div"), { className: "opens" });
  for (const path of paths) {
    const b = Object.assign(document.createElement("button"), { className: "ghost", title: path,
      textContent: "Open in viewer · " + path.split(/[\\/]/).pop() });
    b.onclick = async () => {
      const r = await post("/open-in-viewer", { path }).then((r) => r.json()).catch(() => ({ ok: false, error: "no connection" }));
      row.querySelector(".note")?.remove();
      if (!r.ok) row.append(Object.assign(document.createElement("span"), { className: "note", textContent: "Couldn't open: " + (r.error || "unknown error") }));
    };
    row.append(b);
  }
  return row;
}

// Snips from the HTML viewer wait above the input and go with your next message; × drops one.
function showSnips(list) {
  const strip = document.getElementById("snips");
  strip.replaceChildren(...list.map((s) => {
    const el = Object.assign(document.createElement("div"), { className: "snip", title: s.file });
    const img = Object.assign(document.createElement("img"), { src: "/snip/" + s.id, alt: "snip" });
    const label = Object.assign(document.createElement("span"), { textContent: s.heading || s.file.split(/[\\/]/).pop() });
    const drop = Object.assign(document.createElement("button"), { className: "drop", textContent: "×", title: "Don't send this snip" });
    drop.onclick = () => post("/drop-snip", { id: s.id });
    el.append(img, label, drop);
    return el;
  }));
  strip.classList.toggle("show", list.length > 0);
}

// The snips that went with a message, shown in its bubble as confirmation (same thumbnail size, no ×).
function sentSnips(list) {
  const row = Object.assign(document.createElement("div"), { className: "sent-snips" });
  row.append(...list.map((s) => {
    const el = Object.assign(document.createElement("div"), { className: "snip", title: s.file });
    el.append(Object.assign(document.createElement("img"), { src: "/snip/" + s.id, alt: "snip" }),
              Object.assign(document.createElement("span"), { textContent: s.heading || s.file.split(/[\\/]/).pop() }));
    return el;
  }));
  return row;
}

// Context in the header, worker and Talker apart: what each call sends now (amber from 100k).
const k = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.round(n / 1000) + "k";

// The header follows the selected tab: its worker (`<id>`), its Talker (`talker` for the main
// pair, `talker:<id>` for a helper), and the tokens that pair used (its tally rows).
const contexts = {};  // agent id -> its latest context
let lastTally = null;
const pairIds = () => {
  const id = focused();
  return { worker: id, talker: id === agents.coordinator ? "talker" : "talker:" + id };
};

function showUsage(item) {
  contexts[item.agent] = item.context;
  renderUsage();
}

function renderUsage() {
  const ids = pairIds();
  for (const pane of ["worker", "talker"]) {
    const n = contexts[ids[pane]] || 0;
    const ctx = Object.assign(document.createElement("span"), { className: "ctx", textContent: "context " + k(n) });
    ctx.dataset.level = n >= 100000 ? "high" : "";
    document.getElementById("usage-" + pane).replaceChildren(
      Object.assign(document.createElement("b"), { textContent: pane === "worker" ? "Worker" : "Talker" }), ctx);
  }
  // A helper's Talker is nested under its row; the main Talker has a row of its own.
  const rows = lastTally && lastTally.available ? lastTally.agents.filter((a) => a.agent_id === ids.worker || a.agent_id === ids.talker) : [];
  const used = rows.reduce((sum, a) => sum + a.total.used_tokens, 0);
  document.getElementById("usage-pair").replaceChildren(Object.assign(document.createElement("b"), { textContent: "Used" }), k(used));
}

// --- THROWAWAY usage dropdown (until the UI handler is designed) ---
// The `tally` item is the usage module's usage.total and usage.agents; nothing is added up here.
// A row's numbers include its sub-agents. Tokens only: every call counted, cached context included.
const tallyBtn = document.getElementById("tally-btn"), tallyMenu = document.getElementById("tally-menu");
const agentName = { main_assistant: "Main Assistant", talker: "Talker" };

function tallyRow(cls, name, tokens) {
  const row = Object.assign(document.createElement("div"), { className: "row " + cls });
  row.append(Object.assign(document.createElement("span"), { className: "name", textContent: name }),
    Object.assign(document.createElement("span"), { textContent: k(tokens) }));
  return row;
}

function showTally(item) {
  lastTally = item;
  renderUsage();
  if (!item.available) {
    tallyBtn.textContent = "Total: " + (item.why || "not available") + " ▾";
    tallyMenu.replaceChildren(Object.assign(document.createElement("div"), { className: "none", textContent: item.why || "not available" }));
    return;
  }
  tallyBtn.textContent = `Total ${k(item.total.used_tokens)} ▾`;
  const rows = [];
  const walk = (a, depth) => {  // a closed agent's rows stay (its usage is in the total), greyed
    const closed = a.closed ? " closed" : "", tag = a.closed ? " · closed" : "";
    rows.push(depth ? tallyRow("sub" + closed, a.name + tag, a.total.used_tokens)
      : tallyRow(closed, (agentName[a.agent_id] || a.name) + tag, a.total.used_tokens));
    for (const c of a.children) walk(c, depth + 1);
  };
  for (const a of item.agents) walk(a, 0);
  if (!rows.length) rows.push(Object.assign(document.createElement("div"), { className: "none", textContent: "No agent has used anything yet" }));
  else rows.push(tallyRow("sum", "Total", item.total.used_tokens));
  tallyMenu.replaceChildren(...rows);
}

tallyBtn.onclick = (e) => {
  e.stopPropagation();
  tallyMenu.hidden = !tallyMenu.hidden;
  tallyBtn.setAttribute("aria-expanded", String(!tallyMenu.hidden));
};
document.addEventListener("click", (e) => {
  if (!tallyMenu.hidden && !tallyMenu.contains(e.target)) { tallyMenu.hidden = true; tallyBtn.setAttribute("aria-expanded", "false"); }
});
// --- end of the usage dropdown ---

// The mic (voice_in): the button shows VoiceState; the grey line shows the live text, the
// dropped mic's countdown and word count, or why it failed. Spoken messages land in the chat
// as your own, from InputReceived.
const micButton = document.getElementById("mic"), clearButton = document.getElementById("mic-clear"), voiceLine = document.getElementById("voice");
let voice = { state: "idle", text: "", settled: 0, detail: null, until: null }, countdown = null;
const words = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);

function voiceText() {
  if (voice.state === "listening") return voice.text || (voice.detail ? "Listening… " + voice.detail : "Listening…");
  if (voice.state === "finishing") return (voice.text ? voice.text + " " : "") + (voice.detail || "cleaning up…");
  if (voice.state === "starting") return "Starting the mic…";
  if (voice.state === "dropped") {
    const left = voice.until ? Math.max(0, Math.ceil((voice.until - Date.now()) / 1000)) : null;
    const n = words(voice.text);
    return "⦸ Mic dropped" + (left !== null ? `, waiting ${left} s for it to come back` : voice.detail ? ": " + voice.detail : "") +
      ` · ${n} word${n === 1 ? "" : "s"} so far`;
  }
  if (voice.available === false) return "⦸ " + voice.why;
  return voice.detail ? "Mic: " + voice.detail : "";
}

// Unavailable: crossed out, with why. Clickable only when the voice app is down (a click retries).
function showVoice(item) {
  voice = item;
  micButton.dataset.state = voiceLine.dataset.state = item.state;
  const off = item.available === false && !["listening", "starting", "dropped"].includes(item.state);
  micButton.classList.toggle("off", off);
  micButton.disabled = off && !item.retry;
  micButton.title = off ? item.why : { listening: "Listening: click to send what you said", dropped: "The mic dropped: click to stop",
    starting: "Starting the mic…", finishing: "Cleaning up what you said; it's sent in a moment" }[item.state] ||
    "Click to talk, click again to send what you said";
  clearButton.hidden = !["listening", "dropped", "finishing"].includes(item.state);
  clearInterval(countdown);
  if (item.state === "dropped" && item.until) countdown = setInterval(renderVoice, 250);
  renderVoice();
}

// The line's first `settled` characters (cleaned by whisper) in normal text, the rest dimmed.
function renderVoice() {
  const line = voiceText();
  const settled = ["listening", "finishing"].includes(voice.state) && voice.text ? Math.min(voice.settled || 0, line.length) : 0;
  voiceLine.textContent = "";
  if (settled) {
    const strong = document.createElement("span");
    strong.className = "settled";
    strong.textContent = line.slice(0, settled);
    voiceLine.append(strong, line.slice(settled));
  } else voiceLine.textContent = line;
  voiceLine.classList.toggle("show", !!line);
}

micButton.onclick = async () => {
  if (voice.state === "starting" || voice.state === "finishing") return;  // finishing: clicks are ignored
  const on = !(voice.state === "listening" || voice.state === "dropped");
  if (on) showVoice({ ...voice, state: "starting", text: "", detail: null });  // the server confirms it at once
  const r = await post("/mic", { on, agent: focused() }).then((r) => r.json()).catch(() => ({ ok: false, error: "no connection" }));
  if (!r.ok && r.error === "no connection") showVoice({ ...voice, state: "failed", detail: "no connection to the app" });
};

// The ✕: throw away what was heard (nothing goes to the Talker) and keep listening in a new session.
clearButton.onclick = async () => {
  showVoice({ ...voice, state: "starting", text: "", detail: null });  // the line empties at once
  const r = await post("/mic", { clear: true }).then((r) => r.json()).catch(() => ({ ok: false, error: "no connection" }));
  if (!r.ok && r.error === "no connection") showVoice({ ...voice, state: "failed", detail: "no connection to the app" });
};

// The big agents: one tab each (with two or more), the focused one selected. Both panes show
// the focused agent's items: the worker feed its lines, the Talker pane its own chat (items
// without an agent show always); the pill its state.
const tabs = document.getElementById("tabs");
const pair = document.getElementById("talker-pair");
let agents = { focus: null, coordinator: "main_assistant", agents: [] };
const states = {};
const label = (id) => (id === agents.coordinator ? "Main Assistant" : id);
const focused = () => agents.focus || agents.coordinator;
const shown = (el) => !el.dataset.agent || el.dataset.agent === focused();

function showState() {
  const s = states[focused()] || "idle";
  stateEl.dataset.state = s;
  stateText.textContent = s;
}

function showAgents(item) {
  const before = focused();
  saveScroll(before);  // measured while the old tab's lines are still shown
  agents = item;
  const changed = before !== focused();
  for (const id of Object.keys(scrollMemory)) if (!item.agents.some((a) => a.id === id)) delete scrollMemory[id];  // a closed tab starts fresh
  tabs.replaceChildren(...(item.agents.length < 2 ? [] : item.agents.map((a) => {
    const b = Object.assign(document.createElement("button"), { type: "button", className: "tab" + (a.id === item.coordinator ? " main" : "") });
    b.setAttribute("role", "tab");
    b.dataset.agent = a.id;
    b.setAttribute("aria-selected", String(a.id === focused()));
    b.dataset.state = a.state === "active" ? "working" : "idle";
    b.append(Object.assign(document.createElement("span"), { className: "dot" }), label(a.id));
    if (a.held) b.append(Object.assign(document.createElement("span"), { className: "bang", textContent: "!" }));
    b.title = a.id === focused() ? "You're talking to " + label(a.id)
      : a.held ? label(a.id) + " has a question waiting: click to talk to it" : "Click to talk to " + label(a.id);
    b.onclick = async () => {
      if (a.id === focused()) return;
      const r = await post("/focus", { agent: a.id }).then((r) => r.json()).catch(() => ({ ok: false, error: "no connection" }));
      if (!r.ok) alert("Couldn't switch to " + label(a.id) + ": " + (r.error || "unknown error"));
    };
    return b;
  })));
  if (window.agentTabsExtras) window.agentTabsExtras(tabs, item);  // the + and the × (agent_tabs.js)
  for (const pane of Object.values(panes)) for (const el of pane.children) el.hidden = !shown(el);
  pair.textContent = item.agents.length < 2 ? "" : label(focused());
  pair.classList.toggle("helper", focused() !== item.coordinator);
  restoreScroll(focused(), changed);
  showState();
  renderMode();
  renderUsage();
}

function add(item) {
  if (item.kind === "voice") return showVoice(item);
  if (item.kind === "snips") return showSnips(item.snips);
  if (item.kind === "usage") return showUsage(item);
  if (item.kind === "tally") return showTally(item);
  if (item.kind === "mode") return showMode(item);
  if (item.kind === "agents") return showAgents(item);
  if (item.pane === "worker" && item.kind === "state") {
    states[item.agent || agents.coordinator] = item.text;
    return showState();
  }
  if (item.kind === "answered") {
    document.querySelectorAll(`.perm[data-task="${item.task_id}"]:not(.done):not(.risky)`).forEach((c) => settle(c, item.text + " · " + item.t));
    return;
  }
  if (item.kind === "access_closed") {
    document.querySelectorAll(`.perm.access[data-request="${item.request_id}"]:not(.done)`).forEach((c) => settle(c, item.text + " · " + item.t, "Access"));
    return;
  }
  const pane = panes[item.pane];
  if (!pane) return;
  pane.querySelector(".empty")?.remove();
  const follow = stuck[item.pane] || atBottom(pane);
  let el = document.createElement("div");
  if (item.kind === "permission") {
    el = permissionCard(item);
  } else if (item.kind === "access") {
    el = accessCard(item);
  } else if (item.kind === "risky") {
    el = riskyCard(item);
  } else if (item.pane === "talker") {
    el.className = "msg " + item.kind;
    el.textContent = item.text;
    if (item.snips?.length) el.append(sentSnips(item.snips));
    const t = document.createElement("span");
    t.className = "time";
    t.textContent = item.voice ? "spoken · " + item.t : item.t;
    el.append(t);
    const opens = item.kind === "talker" && openButtons(item.text);
    if (opens) el.append(opens);
  } else {
    el.className = "line " + item.kind;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = item.t;
    el.append(t, item.text);
  }
  if (item.agent) el.dataset.agent = item.agent;  // the worker's lines and each tab's chat
  el.hidden = !shown(el);
  pane.append(el);
  if (follow) pane.scrollTop = pane.scrollHeight;
}

// Each app launch has its own id. Same id on reconnect: the server replays its history.
// A new id means the app was relaunched and opened a fresh window, so this one closes
// (in app mode the app also closes it at startup; see temp_ui/module.py).
let launch = null;

function connect() {
  const source = new EventSource("/events");
  source.onopen = () => { conn.textContent = "connected"; };
  source.onmessage = (e) => {
    const item = JSON.parse(e.data);
    if (item.kind !== "hello") return add(item);
    if (launch && launch !== item.launch) {
      source.close();
      window.close();
      // Still open (the browser refused, e.g. a normal tab): say so instead of a blank chat.
      conn.textContent = "session ended";
      document.querySelector("main").replaceChildren(Object.assign(document.createElement("div"),
        { className: "empty", textContent: "This session ended; the app opened a new window." }));
      return;
    }
    launch = item.launch;
    for (const pane of Object.values(panes)) pane.replaceChildren();
  };
  source.onerror = () => { conn.textContent = "disconnected, retrying…"; };
}
connect();

document.getElementById("logs").onclick = () => fetch("/open-logs", { method: "POST" });
document.querySelectorAll("[data-reset]").forEach((b) => {
  b.onclick = () => post("/reset", { agent: b.dataset.reset, tab: focused() });  // the pair of the tab you're in
});

const form = document.getElementById("say"), text = document.getElementById("text");
// The typing box's height: dragged on #grip, one size for every tab, kept across sends and refreshes.
const grip = document.getElementById("grip"), talkerFeed = document.getElementById("talker");
const BOX_MIN = 40, BOX_KEY = "temp_ui.boxHeight";
function boxLimit() {  // at most 60% of the window, and the chat keeps at least 120 px
  const room = text.offsetHeight + talkerFeed.clientHeight - 120;
  return Math.max(BOX_MIN, Math.min(window.innerHeight * 0.6, room));
}
function setBox(h, save = true) {
  h = Math.round(Math.max(BOX_MIN, Math.min(boxLimit(), h)));
  text.style.height = h + "px";
  if (save) localStorage.setItem(BOX_KEY, String(h));
}
setBox(Number(localStorage.getItem(BOX_KEY)) || BOX_MIN, false);
let boxDrag = null;
grip.addEventListener("pointerdown", (e) => {
  boxDrag = { y: e.clientY, h: text.offsetHeight };
  grip.setPointerCapture(e.pointerId); grip.classList.add("drag"); e.preventDefault();
});
grip.addEventListener("pointermove", (e) => { if (boxDrag) setBox(boxDrag.h + boxDrag.y - e.clientY); });
const endBoxDrag = () => { boxDrag = null; grip.classList.remove("drag"); };
grip.addEventListener("pointerup", endBoxDrag);
grip.addEventListener("pointercancel", endBoxDrag);
grip.addEventListener("dblclick", () => setBox(BOX_MIN));
window.addEventListener("resize", () => setBox(text.offsetHeight, false));
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const value = text.value.trim();
  // Nothing typed still sends when a snip is waiting (the server gives it the text "(snip)").
  if (!value && !document.querySelector("#snips.show")) return;
  text.value = "";
  await post("/say", { text: value, agent: focused() });  // the tab you typed in
});
text.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
// Pasting an image (Ctrl+V) makes it a snip: the server saves it, and it comes back like a viewer
// snip (thumbnail, ×, sent with your next message). A paste that also holds text stays a text paste.
text.addEventListener("paste", async (e) => {
  const items = [...(e.clipboardData?.items || [])];
  const item = items.find((i) => i.kind === "file" && i.type.startsWith("image/"));
  if (!item || items.some((i) => i.type === "text/plain")) return;
  e.preventDefault();
  let image = item.getAsFile();
  if (image && image.type !== "image/png") {  // the server keeps PNGs only
    const bitmap = await createImageBitmap(image);
    const canvas = Object.assign(document.createElement("canvas"), { width: bitmap.width, height: bitmap.height });
    canvas.getContext("2d").drawImage(bitmap, 0, 0);
    image = await new Promise((done) => canvas.toBlob(done, "image/png"));
  }
  const r = image ? await fetch("/paste-image", { method: "POST", headers: { "Content-Type": "image/png" }, body: image })
    .then((x) => x.json()).catch(() => null) : null;
  if (!r || !r.ok) {
    const was = text.placeholder;
    text.placeholder = "Couldn't paste the image: " + (r?.error || "no answer from the app");
    setTimeout(() => { text.placeholder = was; }, 6000);
  }
});
</script>
