<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML viewer</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --border: #e3e1db; --text: #1d1d1b; --muted: #77756e;
  --accent: #6b4fa0; --accent-text: #ffffff; --tab: #efedf5; --warn: #c58a1a; --edit: #6b4fa0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --border: #33322f; --text: #ebe9e4; --muted: #9a978e;
    --accent: #8f72c9; --accent-text: #ffffff; --tab: #2a2833; --warn: #e0a93a; --edit: #8f72c9;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
#tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab {
  display: flex; align-items: center; gap: 6px; max-width: 240px; padding: 6px 8px 6px 12px;
  border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--muted);
}
.tab.active { background: var(--panel); border-color: var(--border); color: var(--text); margin-bottom: -1px; }
.tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); visibility: hidden; }
.tab.dirty .dot { visibility: visible; }
.tab .x { border: 0; background: none; color: inherit; font-size: 15px; line-height: 1; padding: 0 2px; cursor: pointer; border-radius: 4px; }
.tab .x:hover { background: var(--tab); }
#bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--border); }
#bar button {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border);
  border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-weight: 500; cursor: pointer;
}
#bar button:hover:not(:disabled) { background: var(--tab); }
#bar button:disabled { opacity: .45; cursor: default; }
#bar svg { width: 14px; height: 14px; }
#path { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
#hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
#note { display: none; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--warn); background: var(--panel); }
#note.show { display: flex; }
#note .text { flex: 1; }
#note button { height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; cursor: pointer; }
#note button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
#views { flex: 1; position: relative; background: var(--panel); }
#views iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
#views iframe.active { display: block; }
.empty { color: var(--muted); padding: 48px; text-align: center; }
#snipper { position: absolute; inset: 0; z-index: 10; display: none; cursor: crosshair; background: rgba(0,0,0,.18); }
#snipper.show { display: block; }
#snipper.hidden { visibility: hidden; }
#snipper .box { position: absolute; border: 2px solid var(--accent); background: rgba(255,255,255,.12); display: none; }
#snipper .tip { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 8px;
  background: var(--panel); color: var(--text); border: 1px solid var(--border); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button id="undo" title="Undo (Ctrl+Z)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    Undo
  </button>
  <button id="save" title="Save (Ctrl+S)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8"/><path d="M7 21v-7h10v7"/></svg>
    Save
  </button>
  <button id="snip" title="Snip part of the page for the assistant (Ctrl+Shift+S)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
    Snip
  </button>
  <span id="path"></span>
  <span id="hint">Double-click text to edit</span>
</div>
<div id="note"><span class="text"></span></div>
<div id="views"><div class="empty">No files open. The assistant opens files here.</div>
  <div id="snipper"><div class="box"></div><div class="tip">Drag a box to snip it for the assistant · Esc cancels</div></div>
</div>
<script>
// The view: it draws what the viewer program holds (tabs, each tab's document state) and sends
// your actions to it as commands. It never keeps its own copy of a document.
const tabsEl = document.getElementById("tabs"), views = document.getElementById("views");
const undoBtn = document.getElementById("undo"), saveBtn = document.getElementById("save");
const pathEl = document.getElementById("path"), note = document.getElementById("note");
const snipBtn = document.getElementById("snip"), snipper = document.getElementById("snipper");
const tabs = new Map();  // id -> { info, frame }
let active = null;
let pending = Promise.resolve();  // the last edit's round trip

// Elements the edit tool works on: text blocks. Diagrams, code blocks, and SVG stay as they are.
const TEXT_BLOCKS = "p,li,h1,h2,h3,h4,h5,h6,td,th,dt,dd,figcaption,caption,summary,label,blockquote";
const NOT_EDITABLE = "pre,svg,script,style,textarea,input,select,.diagram,.mermaid";

async function api(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return await r.json();
  } catch { return { ok: false, error: "The viewer isn't reachable" }; }
}

function showNote(text, actions = []) {
  note.querySelector(".text").textContent = text;
  note.querySelectorAll("button").forEach((b) => b.remove());
  for (const [label, run, primary] of [...actions, ["Dismiss", () => {}]]) {
    const b = Object.assign(document.createElement("button"), { textContent: label, className: primary ? "primary" : "" });
    b.onclick = () => { note.classList.remove("show"); run(); };
    note.append(b);
  }
  note.classList.add("show");
}

// --- tabs ---

function render(list, activeId) {
  const seen = new Set();
  for (const info of list) {
    seen.add(info.id);
    let tab = tabs.get(info.id);
    if (!tab) {
      const frame = document.createElement("iframe");
      frame.src = info.src;
      frame.addEventListener("load", () => attach(info.id, frame));
      views.querySelector(".empty")?.remove();
      views.append(frame);
      tab = { info, frame };
      tabs.set(info.id, tab);
    }
    tab.info = info;
    // A new highlight request: scroll to it (once per request, also in a window opened later).
    if (info.focus && tab.focused !== info.focus.n) { tab.focused = info.focus.n; tab.scrollTo = info.focus.id; }
  }
  for (const [id, tab] of tabs) {
    if (!seen.has(id)) { tab.frame.remove(); tabs.delete(id); }
  }
  active = activeId;
  tabsEl.replaceChildren(...list.map((info) => {
    const el = Object.assign(document.createElement("div"), { className: "tab" + (info.active ? " active" : "") + (info.dirty ? " dirty" : ""), title: info.path });
    el.append(Object.assign(document.createElement("span"), { className: "dot" }),
              Object.assign(document.createElement("span"), { className: "name", textContent: info.name }));
    const x = Object.assign(document.createElement("button"), { className: "x", textContent: "×", title: "Close" });
    x.onclick = (e) => {
      e.stopPropagation();
      if (info.dirty && !confirm(`${info.name} has unsaved edits. Close it anyway?`)) return;
      api("/api/close", { tab: info.id });
    };
    el.append(x);
    el.onclick = () => api("/api/focus", { tab: info.id });
    return el;
  }));
  for (const [id, tab] of tabs) { tab.frame.classList.toggle("active", id === active); drawMarks(id); }
  const current = tabs.get(active)?.info;
  pathEl.textContent = current ? current.path : "";
  const editable = current && current.supports.includes("edit");
  undoBtn.disabled = !editable;
  snipBtn.disabled = !current;
  saveBtn.disabled = !(current && current.supports.includes("save") && current.dirty);
  document.getElementById("hint").style.visibility = editable ? "visible" : "hidden";
  document.title = current ? current.name + " · HTML viewer" : "HTML viewer";
  if (!tabs.size && !views.querySelector(".empty")) {
    views.append(Object.assign(document.createElement("div"), { className: "empty", textContent: "No files open." }));
  }
}

function reloadFrame(id) {
  const tab = tabs.get(id);
  if (tab) tab.frame.src = tab.info.src + "&r=" + Date.now();
}

// --- the edit tool, inside a tab's page ---

function attach(id, frame) {
  const doc = frame.contentDocument;
  if (!doc) return;
  doc.head?.append(Object.assign(doc.createElement("style"), { textContent: MARK_STYLE }));
  doc.addEventListener("dblclick", (e) => { hidePopup(doc); startEdit(id, doc, e); });
  doc.addEventListener("keydown", keys);
  doc.addEventListener("click", (e) => followLink(e), true);
  doc.addEventListener("click", (e) => markClicked(id, doc, e));
  const tab = tabs.get(id);
  if (tab) { tab.drawn = null; drawMarks(id); }
}

// --- highlights: drawn over the page from the tab's state, never part of the document ---

const MARK_STYLE = `
mark.hv-mark { background: #2f5fa8; color: #fff; border-radius: 2px; cursor: pointer; box-shadow: 0 0 0 2px #2f5fa8; }
.hv-pop { position: absolute; z-index: 2147483647; display: flex; gap: 4px; padding: 4px; background: #fff; color: #1d1d1b;
  border: 1px solid #e3e1db; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); font: 13px system-ui, sans-serif; }
.hv-pop button { border: 1px solid #e3e1db; background: #fff; color: inherit; border-radius: 6px; padding: 2px 10px; font: inherit; cursor: pointer; }
.hv-pop button:hover { background: #efedf5; }`;
// The same rules as highlight.py: page text only, the quote's words in order, case ignored.
const SKIP_TEXT = "script,style,svg,noscript,template,.mermaid,.hv-pop";
const HEADING = /^H([1-6])$/;

function textNodes(doc, heading) {
  const all = [];
  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement && !n.parentElement.closest(SKIP_TEXT) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  while (walker.nextNode()) all.push(walker.currentNode);
  if (!heading || !heading.trim()) return all;
  const norm = (s) => s.split(/\s+/).filter(Boolean).join(" ").toLowerCase();
  const headings = [...doc.body.querySelectorAll("h1,h2,h3,h4,h5,h6")].filter((h) => !h.closest(SKIP_TEXT));
  const i = headings.findIndex((h) => norm(h.textContent).includes(norm(heading)));
  if (i < 0) return all;
  const level = +HEADING.exec(headings[i].tagName)[1];
  const end = headings.slice(i + 1).find((h) => +HEADING.exec(h.tagName)[1] <= level);
  return all.filter((n) => (headings[i].contains(n) || headings[i].compareDocumentPosition(n) & Node.DOCUMENT_POSITION_FOLLOWING)
    && (!end || end.compareDocumentPosition(n) & Node.DOCUMENT_POSITION_PRECEDING));
}

function findQuote(doc, quote, heading) {
  const words = quote.split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const nodes = textNodes(doc, heading);
  const text = nodes.map((n) => n.data).join("");
  const match = new RegExp(words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s*"), "i").exec(text);
  if (!match) return [];
  const pieces = [];  // [node, start, end] for each text node the match covers
  let at = 0;
  for (const n of nodes) {
    const s = Math.max(match.index, at), e = Math.min(match.index + match[0].length, at + n.data.length);
    if (s < e) pieces.push([n, s - at, e - at]);
    at += n.data.length;
  }
  return pieces;
}

function clearMarks(root) {
  for (const m of root.querySelectorAll("mark.hv-mark")) {
    const parent = m.parentNode;
    m.replaceWith(...m.childNodes);
    parent.normalize();
  }
}

function drawMarks(id) {
  const tab = tabs.get(id), doc = tab?.frame.contentDocument;
  if (!doc || !doc.body || doc.querySelector("[contenteditable]")) return;
  const list = tab.info.highlights || [];
  const key = JSON.stringify(list);
  if (tab.drawn !== key) {
    tab.drawn = key;
    hidePopup(doc);
    clearMarks(doc.body);
    for (const h of list) {
      for (const [node, s, e] of findQuote(doc, h.text, h.heading).reverse()) {
        const part = node.splitText(s);
        part.splitText(e - s);
        const mark = Object.assign(doc.createElement("mark"), { className: "hv-mark", title: "Click to clear" });
        mark.dataset.hvMark = h.id;
        part.replaceWith(mark);
        mark.append(part);
      }
    }
  }
  if (tab.scrollTo) {
    const mark = doc.querySelector(`mark[data-hv-mark="${tab.scrollTo}"]`);
    if (mark) { mark.scrollIntoView({ block: "center", behavior: "smooth" }); tab.scrollTo = null; }
  }
}

function hidePopup(doc) { doc.querySelector(".hv-pop")?.remove(); }

function markClicked(id, doc, e) {
  if (e.target.closest?.(".hv-pop")) return;
  hidePopup(doc);
  const mark = e.target.closest?.("mark.hv-mark");
  if (!mark || mark.closest("a[href]") || mark.isContentEditable) return;
  const rect = mark.getBoundingClientRect(), win = doc.defaultView;
  const pop = Object.assign(doc.createElement("div"), { className: "hv-pop" });
  pop.style.left = `${rect.left + win.scrollX}px`;
  pop.style.top = `${rect.bottom + win.scrollY + 6}px`;
  for (const [label, body] of [["Clear", { tab: id, id: mark.dataset.hvMark }], ["Clear all", { tab: id, all: true }]]) {
    const b = Object.assign(doc.createElement("button"), { textContent: label });
    b.onclick = async () => {
      hidePopup(doc);
      const r = await api("/api/clear", body);
      if (!r.ok) showNote("Couldn't clear: " + r.error);
    };
    pop.append(b);
  }
  doc.body.append(pop);
}

function editableAt(target) {
  const el = target.nodeType === 1 ? target : target.parentElement;
  if (!el || el.closest(NOT_EDITABLE)) return null;
  const block = el.closest(TEXT_BLOCKS)
    || (el.hasAttribute("data-hv-id") && !el.children.length && el.textContent.trim() ? el : null);
  return block && block.hasAttribute("data-hv-id") ? block : null;
}

function startEdit(id, doc, e) {
  const el = editableAt(e.target);
  if (!el || el.isContentEditable) return;
  clearMarks(el);  // highlights are drawn, not content: keep them out of the edit
  const tabInfo = tabs.get(id);
  if (tabInfo) tabInfo.drawn = null;
  const before = el.innerHTML;
  el.contentEditable = "true";
  el.style.outline = "2px solid var(--hv-edit, #6b4fa0)";
  el.style.outlineOffset = "2px";
  el.focus();
  let done = false;
  const finish = (keep) => { if (!done) { done = true; pending = commit(keep); } };
  const commit = async (keep) => {
    el.removeAttribute("contenteditable");
    el.style.outline = el.style.outlineOffset = "";
    if (!el.getAttribute("style")) el.removeAttribute("style");
    el.removeEventListener("keydown", onKey);
    const redraw = () => { const tab = tabs.get(id); if (tab) { tab.drawn = null; drawMarks(id); } };
    if (!keep || el.innerHTML === before) { el.innerHTML = before; redraw(); return; }
    const r = await api("/api/edit", { tab: id, id: el.getAttribute("data-hv-id"), html: el.innerHTML });
    if (r.ok) {
      el.innerHTML = r.html;  // the view draws the state
      const tab = tabs.get(id);
      if (tab) tab.info.dirty = r.dirty;
    } else { el.innerHTML = before; showNote("Couldn't edit: " + r.error); }
    redraw();  // highlights drawn while the edit was on its way were replaced with it
  };
  const onKey = (k) => {
    if (k.key === "Enter" && !k.shiftKey) { k.preventDefault(); finish(true); }
    else if (k.key === "Escape") { k.preventDefault(); finish(false); }
  };
  el.addEventListener("keydown", onKey);
  el.addEventListener("blur", () => finish(true), { once: true });
}

// A link to another local HTML file opens in its own tab; a link to the web opens outside.
function followLink(e) {
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a || a.isContentEditable) return;
  const url = new URL(a.href, location.href);
  if (url.origin !== location.origin) { e.preventDefault(); window.open(url.href, "_blank"); return; }
  const here = tabs.get(active)?.frame.contentWindow.location.pathname;
  if (url.pathname.startsWith("/fs/") && url.pathname !== here && /\.html?$/i.test(url.pathname)) {
    e.preventDefault();
    api("/api/open", { fs: url.pathname }).then((r) => { if (!r.ok) showNote("Couldn't open: " + r.error); });
  }
}

// --- undo and save ---

async function undo() {
  await pending;
  if (!active || undoBtn.disabled) return;
  const r = await api("/api/undo", { tab: active });
  if (!r.ok) return showNote("Couldn't undo: " + r.error);
  if (r.empty) return showNote("Nothing to undo.");
  const el = tabs.get(active)?.frame.contentDocument?.querySelector(`[data-hv-id="${r.id}"]`);
  if (el) { el.innerHTML = r.html; tabs.get(active).drawn = null; drawMarks(active); } else reloadFrame(active);
}

async function save(confirmed = false) {
  await pending;  // an edit still being sent
  const tab = active;
  if (!tab || !tabs.get(tab)?.info.dirty) return;
  const r = await api("/api/save", { tab, confirm: confirmed });
  if (!r.ok) return showNote("Couldn't save: " + r.error);
  if (r.warning) showNote(r.warning, [["Save anyway", () => save(true), true]]);
  else if (r.note) showNote(r.note);
}

// --- snip: drag a box over the page; the viewer has Edge screenshot exactly that ---

function startSnip() {
  if (!active || snipBtn.disabled) return;
  snipper.classList.add("show");
  snipper.querySelector(".box").style.display = "none";
}

function stopSnip() { snipper.classList.remove("show", "hidden"); }

// A heading of the page's content, not of a sidebar or a sticky bar (those are always on screen).
function contentHeading(h) {
  if (h.closest("nav,aside,header,footer") || !h.getClientRects().length) return false;
  for (let el = h; el && el.nodeType === 1; el = el.parentElement) {
    if (["sticky", "fixed"].includes(getComputedStyle(el).position)) return false;
  }
  return true;
}

// The nearest heading above the box in the tab's page, to tell the assistant where it's from.
function headingAbove(frame, top) {
  const doc = frame.contentDocument, offset = frame.getBoundingClientRect().top;
  let found = null, best = -Infinity;
  for (const h of doc?.querySelectorAll("h1,h2,h3,h4,h5,h6") || []) {
    const y = h.getBoundingClientRect().top + offset;
    if (y <= top + 4 && y > best && contentHeading(h)) { found = h; best = y; }
  }
  return found ? found.textContent.trim().replace(/\s+/g, " ") : null;
}

snipper.addEventListener("mousedown", (e) => {
  e.preventDefault();
  const box = snipper.querySelector(".box"), origin = snipper.getBoundingClientRect();
  const x0 = e.clientX, y0 = e.clientY;
  const rect = (ev) => ({ x: Math.min(x0, ev.clientX), y: Math.min(y0, ev.clientY), width: Math.abs(ev.clientX - x0), height: Math.abs(ev.clientY - y0) });
  const move = (ev) => {
    const r = rect(ev);
    Object.assign(box.style, { display: "block", left: `${r.x - origin.left}px`, top: `${r.y - origin.top}px`, width: `${r.width}px`, height: `${r.height}px` });
  };
  const up = async (ev) => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    const r = rect(ev), tab = active;
    if (r.width < 4 || r.height < 4) { stopSnip(); return; }
    // Hide the overlay before Edge takes the picture; wait until it's really gone from the screen.
    snipper.classList.add("hidden");
    await new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
    const heading = tabs.get(tab) ? headingAbove(tabs.get(tab).frame, r.y) : null;
    const answer = await api("/api/snip", { tab, ...r, heading });
    stopSnip();
    showNote(answer.ok ? "Snip sent to the assistant: it goes with your next message." : "Couldn't snip: " + answer.error);
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

function keys(e) {
  const mod = e.ctrlKey || e.metaKey;
  const editing = e.target && e.target.isContentEditable;
  if (e.key === "Escape" && snipper.classList.contains("show")) { stopSnip(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === "s") { e.preventDefault(); if (!editing) startSnip(); return; }
  if (mod && e.key.toLowerCase() === "z" && !e.shiftKey && !editing) { e.preventDefault(); undo(); }
  else if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); if (editing) e.target.blur(); save(); }
}

undoBtn.onclick = undo;
saveBtn.onclick = () => save();
snipBtn.onclick = startSnip;
document.addEventListener("keydown", keys);

// --- events from the viewer program ---

function connect() {
  const source = new EventSource("/api/events?client=page");
  source.onmessage = (e) => {
    const item = JSON.parse(e.data);
    if (item.kind === "tabs") render(item.tabs, item.active);
    else if (item.kind === "reload") reloadFrame(item.tab);
    else if (item.kind === "changed") {
      const name = tabs.get(item.tab)?.info.name || "This file";
      showNote(`${name} changed on disk, and you have unsaved edits here.`,
        [["Reload (drop my edits)", () => api("/api/reload", { tab: item.tab }), true]]);
    }
  };
}
connect();
</script>
</body>
</html>
