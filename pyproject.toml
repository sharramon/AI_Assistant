[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "Modular personal AI assistant"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "markdown>=3.6"]

[project.scripts]
# A companion app inside its module (modules/<id>/app/<app>) has no script entry: the module launches it,
# or run it by hand with that app/ folder on PYTHONPATH (the HTML viewer: see its module's docs).
voice-service = "voice_service.__main__:main"  # the voice service, a standalone app (src/voice_service)

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]
# Voice input: the voice service (FastAPI, Uvicorn, sherpa-onnx, faster-whisper, sounddevice) and voice_in's client (websockets).
voice = ["fastapi>=0.110", "uvicorn>=0.29", "sherpa-onnx>=1.10", "faster-whisper>=1.2", "sounddevice>=0.4.6", "websockets>=12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Each module carries its own tests in its folder (src/assistant/modules/<id>/tests/).
testpaths = ["tests", "src/assistant/modules"]
# Tests that run a real `claude` process are skipped by default (and in CI).
# Run them on your own machine with: pytest -m claude
addopts = "-m 'not claude'"
markers = ["claude: runs a real claude process; needs a logged-in claude CLI"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Each module's app/ folder holds its companion app's package, imported by its own name; this glob makes
# every such app first-party, so known-first-party below doesn't list them.
src = ["src", ".", "src/assistant/modules/*/app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines: not enforced
    "B024",  # Contract is an ABC with no abstract methods on purpose
    "B027",  # Module.start/stop are deliberately optional no-ops
]

# A module's own exceptions go in a ruff.toml in its folder, which extends this file.

[tool.ruff.lint.isort]
known-first-party = ["app_kit", "assistant", "tests", "voice_service"]
