<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" aria-label="How modules talk: tool calls, commands and events through the core">
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; }
  </style>
  <rect x="0" y="0" width="1100" height="550" fill="#fbfaf7"/>
  <defs>
    <marker id="z0t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7c7a"/></marker>
    <marker id="z0c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55534d"/></marker>
    <marker id="z0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker>
    <marker id="z0ht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#fff" stroke="#0f7c7a" stroke-width="1.5"/></marker>
    <marker id="z0hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#fff" stroke="#55534d" stroke-width="1.5"/></marker>
  </defs>
  <g font-size="12">
    <!-- left: senders -->
    <rect x="20" y="58" width="245" height="58" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="32" y="80" font-size="15" font-weight="700">Agents</text>
    <text x="32" y="100">Talker · Main Assistant · helpers (MCP)</text>
    <rect x="20" y="132" width="245" height="150" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="32" y="154" font-size="15" font-weight="700">job_search (add-on)</text>
    <text x="32" y="174" fill="#6f6d66">its manifest (module.py) declares:</text>
    <text x="32" y="190">sends = InvokeTool, DeliverMessage, …</text>
    <text x="32" y="214" font-family="Consolas, monospace" font-size="11.5" fill="#0f7c7a" font-weight="700">T1 ctx.send(InvokeTool(</text>
    <text x="32" y="230" font-family="Consolas, monospace" font-size="11.5" fill="#0f7c7a" font-weight="700">     name="cv.task", args=…))</text>
    <text x="32" y="256" font-family="Consolas, monospace" font-size="11.5" fill="#55534d" font-weight="700">C1 ctx.send(DeliverMessage(…))</text>
    <rect x="20" y="392" width="245" height="84" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="32" y="414" font-size="15" font-weight="700">voice_in (core module)</text>
    <text x="32" y="434">manifest: publishes = VoiceTranscript, …</text>
    <text x="32" y="458" font-family="Consolas, monospace" font-size="11.5" fill="#2f6f9f" font-weight="700">E1 ctx.publish(VoiceTranscript(…))</text>

    <!-- the core -->
    <rect x="290" y="20" width="520" height="470" rx="12" fill="#f1f0ec" stroke="#55534d" stroke-width="2.5"/>
    <text x="305" y="44" font-size="16" font-weight="700">Core: every message between modules passes here</text>
    <rect x="305" y="58" width="170" height="58" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="317" y="78" font-size="14" font-weight="700">Module door · D1</text>
    <text x="317" y="94" font-size="11.5">agents' list · menu · use</text>
    <text x="317" y="109" font-size="11.5">token proves caller → router</text>
    <rect x="305" y="130" width="170" height="245" rx="8" fill="#fff" stroke="#55534d" stroke-width="2"/>
    <text x="317" y="152" font-size="14" font-weight="700">Router · D3</text>
    <text x="317" y="172" fill="#6f6d66">every ctx.send comes here</text>
    <text x="317" y="194" fill="#0f7c7a" font-weight="600">✓ type is in manifest sends</text>
    <text x="317" y="212" fill="#0f7c7a" font-weight="600">✓ sent_by stamped</text>
    <text x="317" y="230" fill="#0f7c7a" font-weight="600">✓ InvokeTool: caller is</text>
    <text x="317" y="246" fill="#0f7c7a" font-weight="600">   the sender</text>
    <text x="317" y="266" fill="#0f7c7a" font-weight="600">✓ control commands only</text>
    <text x="317" y="282" fill="#0f7c7a" font-weight="600">   from "you"</text>
    <text x="317" y="324">→ the one handler</text>
    <text x="317" y="340">   registered for the type</text>
    <text x="317" y="358" fill="#6f6d66">(InvokeTool's is the gate)</text>
    <rect x="500" y="58" width="295" height="150" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="512" y="80" font-size="14" font-weight="700">One gate · D4 · dispatch_tool</text>
    <text x="512" y="100">handles every InvokeTool</text>
    <text x="512" y="118">finds the one module offering cv.task</text>
    <text x="512" y="136">off and start_on_use: starts it first</text>
    <text x="512" y="154">checks the arguments + the item's callers</text>
    <text x="512" y="172">risky item: asks you on a card (D6)</text>
    <text x="512" y="194" fill="#0f7c7a" font-weight="600">then calls the item as that caller</text>
    <rect x="500" y="222" width="295" height="40" rx="8" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
    <text x="512" y="247">Cards · D6: a risky call runs after your Allow</text>
    <rect x="305" y="392" width="490" height="84" rx="8" fill="#fff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="317" y="414" font-size="14" font-weight="700">Bus · D5</text>
    <text x="390" y="414" fill="#0f7c7a" font-weight="600">✓ a typed event must be in manifest publishes</text>
    <text x="317" y="434">publish returns at once; the publisher gets nothing back</text>
    <text x="317" y="452">each listener gets its own copy, on its own worker and queue</text>
    <text x="317" y="468" fill="#6f6d66">events only notify, never control</text>

    <!-- right: receivers -->
    <rect x="835" y="58" width="250" height="150" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="847" y="80" font-size="15" font-weight="700">cv (add-on)</text>
    <text x="847" y="100">its menu item cv.task, linked into</text>
    <text x="847" y="116">the core when cv starts (link_menu)</text>
    <text x="847" y="138" fill="#0f7c7a" font-weight="700">T3 runs, returns a Result</text>
    <text x="847" y="162" fill="#6f6d66">later it publishes the named event</text>
    <text x="847" y="178" fill="#6f6d66">cv.job_finished; job_search listens</text>
    <text x="847" y="194" fill="#6f6d66">to it by name, through the same Bus</text>
    <rect x="835" y="222" width="250" height="100" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="847" y="244" font-size="15" font-weight="700">agent_hub (core module)</text>
    <text x="847" y="264" font-family="Consolas, monospace" font-size="11.5">start(): ctx.handle(</text>
    <text x="847" y="280" font-family="Consolas, monospace" font-size="11.5">  DeliverMessage, deliver)</text>
    <text x="847" y="300">manifest: handles = DeliverMessage</text>
    <rect x="835" y="338" width="250" height="92" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="847" y="360" font-size="15" font-weight="700">voice_notes (add-on)</text>
    <text x="847" y="378">manifest: listens = VoiceTranscript</text>
    <text x="847" y="398" font-family="Consolas, monospace" font-size="11.5">start(): ctx.subscribe(</text>
    <text x="847" y="414" font-family="Consolas, monospace" font-size="11.5">  VoiceTranscript, on_text)</text>
    <rect x="835" y="440" width="250" height="40" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="847" y="464">any other listener: its own copy</text>

    <!-- tool call: teal -->
    <g stroke="#0f7c7a" stroke-width="2.5" fill="none">
      <line x1="265" y1="87" x2="303" y2="87" marker-end="url(#z0t)"/>
      <line x1="390" y1="116" x2="390" y2="128" marker-end="url(#z0t)"/>
      <line x1="265" y1="222" x2="303" y2="222" marker-end="url(#z0t)"/>
      <line x1="475" y1="160" x2="498" y2="160" marker-end="url(#z0t)"/>
      <line x1="795" y1="118" x2="833" y2="118" marker-end="url(#z0t)"/>
    </g>
    <g stroke="#0f7c7a" stroke-width="2.5" fill="none" stroke-dasharray="6 4">
      <line x1="833" y1="178" x2="797" y2="178" marker-end="url(#z0ht)"/>
      <line x1="500" y1="190" x2="477" y2="190" marker-end="url(#z0ht)"/>
      <line x1="305" y1="240" x2="267" y2="240" marker-end="url(#z0ht)"/>
    </g>
    <!-- command: grey -->
    <g stroke="#55534d" stroke-width="2.5" fill="none">
      <line x1="265" y1="262" x2="303" y2="262" marker-end="url(#z0c)"/>
      <line x1="475" y1="290" x2="833" y2="290" marker-end="url(#z0c)"/>
    </g>
    <g stroke="#55534d" stroke-width="2.5" fill="none" stroke-dasharray="6 4">
      <line x1="833" y1="312" x2="477" y2="312" marker-end="url(#z0hc)"/>
      <line x1="305" y1="275" x2="267" y2="275" marker-end="url(#z0hc)"/>
    </g>
    <!-- events: blue -->
    <g stroke="#2f6f9f" stroke-width="2.5" fill="none">
      <line x1="265" y1="434" x2="303" y2="434" marker-end="url(#z0b)"/>
      <path d="M795 410 L815 410 L815 384 L833 384" marker-end="url(#z0b)"/>
      <line x1="795" y1="460" x2="833" y2="460" marker-end="url(#z0b)"/>
    </g>
    <!-- arrow tags -->
    <g font-size="12" font-weight="700">
      <text x="480" y="153" fill="#0f7c7a">T2</text>
      <text x="801" y="111" fill="#0f7c7a">T3</text>
      <text x="801" y="196" fill="#0f7c7a">T4</text>
      <text x="505" y="284" fill="#55534d">C2 to the one handler for DeliverMessage</text>
      <text x="505" y="328" fill="#55534d">C3 its Result back to the sender</text>
      <text x="799" y="400" fill="#2f6f9f">E2</text>
      <text x="799" y="454" fill="#2f6f9f">E2</text>
    </g>
    <!-- never -->
    <line x1="142" y1="516" x2="960" y2="516" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="3 5"/>
    <circle cx="551" cy="516" r="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
    <text x="551" y="521" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">✗</text>
    <text x="142" y="540" font-size="12.5" fill="#c0392b" font-weight="600">never: one module importing or calling another directly; tests/test_boundaries.py checks it</text>
  </g>
</svg>
