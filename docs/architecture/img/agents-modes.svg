<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Talker per tab. Two modes. A, normal: you talk to the Main Assistant through the main tab's Talker; the job agent sends STATUS lines to it, its questions and finished work are held behind the !, and the job tab's Talker is idle. B, direct: you open the job tab; the held items load into its own Talker and you talk to the job agent; it still sends STATUS lines to the Main Assistant, whose questions wait behind the ! on its tab">
  <style>text { font-family: "Segoe UI", system-ui, sans-serif; fill: #1d1d1b; }</style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6d66"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/></marker>
  </defs>
  <rect width="1180" height="470" fill="#ffffff"/>
  <line x1="590" y1="20" x2="590" y2="450" stroke="#e2ded3" stroke-width="2"/>

  <!-- A · Normal -->
  <text x="20" y="30" font-weight="800" font-size="17">A · Normal: you're in the Main tab</text>
  <text x="20" y="48" font-size="12" style="fill:#5f5e58">a Talker per tab</text>
  <!-- lines first, so the Hub band sits on top of them -->
  <line x1="55" y1="122" x2="55" y2="318" stroke="#2f6f9f" stroke-width="3" marker-start="url(#aB)" marker-end="url(#aB)"/>
  <line x1="160" y1="318" x2="160" y2="226" stroke="#0f7b6c" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aT)"/>
  <line x1="490" y1="318" x2="490" y2="226" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aR)"/>
  <rect x="20" y="64" width="180" height="56" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="2.5"/>
  <text x="110" y="88" text-anchor="middle" font-weight="800" font-size="15">Talker · Main tab</text>
  <text x="110" y="107" text-anchor="middle" font-size="12">you speak · type</text>
  <rect x="370" y="64" width="190" height="56" rx="10" fill="#f2f1ee" stroke="#8a877c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="465" y="88" text-anchor="middle" font-weight="800" font-size="15" style="fill:#5f5e58">Talker · Job tab</text>
  <text x="465" y="107" text-anchor="middle" font-size="12" style="fill:#5f5e58">idle: no turns</text>
  <rect x="20" y="172" width="540" height="52" rx="10" fill="#efeaf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="290" y="194" text-anchor="middle" font-weight="800" font-size="15" style="fill:#4b3577">Agent Hub</text>
  <text x="290" y="213" text-anchor="middle" font-size="12">focus: Main tab · ! on the job tab</text>
  <text x="63" y="270" font-size="12" style="fill:#1f4f73">your talk</text>
  <text x="168" y="262" font-size="12" style="fill:#0b5c51">suggests:</text>
  <text x="168" y="277" font-size="12" style="fill:#0b5c51">"talk to the job agent?"</text>
  <text x="498" y="262" font-size="12" style="fill:#b3261e">NEED · done:</text>
  <text x="498" y="277" font-size="12" style="fill:#b3261e">held (!)</text>
  <rect x="20" y="320" width="180" height="70" rx="10" fill="#d9f0ea" stroke="#0f7b6c" stroke-width="3"/>
  <text x="110" y="344" text-anchor="middle" font-weight="800" font-size="15" style="fill:#0b5c51">Main Assistant</text>
  <text x="110" y="363" text-anchor="middle" font-size="13" font-weight="700">FOCUSED</text>
  <text x="110" y="380" text-anchor="middle" font-size="12">never interrupted</text>
  <rect x="370" y="320" width="190" height="70" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="2.5"/>
  <text x="465" y="344" text-anchor="middle" font-weight="800" font-size="15">Job agent</text>
  <text x="465" y="363" text-anchor="middle" font-size="13">keeps working</text>
  <text x="465" y="380" text-anchor="middle" font-size="12">its question waits</text>
  <line x1="368" y1="370" x2="204" y2="370" stroke="#6f6d66" stroke-width="2.5" marker-end="url(#aG)"/>
  <text x="285" y="346" text-anchor="middle" font-size="12" style="fill:#3d3c38">STATUS: one line</text>
  <text x="285" y="361" text-anchor="middle" font-size="12" style="fill:#3d3c38">at its next turn</text>
  <text x="20" y="426" font-size="13">The main chat has only your talk with the Main Assistant.</text>
  <text x="20" y="446" font-size="13">The job agent's questions and finished work wait behind the !.</text>

  <!-- B · Direct -->
  <g transform="translate(600,0)">
  <text x="20" y="30" font-weight="800" font-size="17">B · Direct: you open the job tab</text>
  <text x="20" y="48" font-size="12" style="fill:#5f5e58">a Talker per tab</text>
  <line x1="530" y1="122" x2="530" y2="318" stroke="#2f6f9f" stroke-width="3" marker-start="url(#aB)" marker-end="url(#aB)"/>
  <line x1="420" y1="170" x2="420" y2="124" stroke="#b3261e" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="110" y1="318" x2="110" y2="226" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aR)"/>
  <rect x="20" y="64" width="180" height="56" rx="10" fill="#f2f1ee" stroke="#8a877c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="110" y="88" text-anchor="middle" font-weight="800" font-size="15" style="fill:#5f5e58">Talker · Main tab</text>
  <text x="110" y="107" text-anchor="middle" font-size="12" style="fill:#5f5e58">idle while you're away</text>
  <rect x="370" y="64" width="190" height="56" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="2.5"/>
  <text x="465" y="88" text-anchor="middle" font-weight="800" font-size="15">Talker · Job tab</text>
  <text x="465" y="107" text-anchor="middle" font-size="12">its own chat · you speak · type</text>
  <rect x="20" y="172" width="540" height="52" rx="10" fill="#efeaf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="290" y="194" text-anchor="middle" font-weight="800" font-size="15" style="fill:#4b3577">Agent Hub</text>
  <text x="290" y="213" text-anchor="middle" font-size="12">focus → job tab · releases its held items</text>
  <text x="340" y="146" text-anchor="end" font-size="12" style="fill:#b3261e">held items load in</text>
  <text x="118" y="262" font-size="12" style="fill:#b3261e">its NEED:</text>
  <text x="118" y="277" font-size="12" style="fill:#b3261e">! on its tab</text>
  <text x="522" y="270" text-anchor="end" font-size="12" style="fill:#1f4f73">your talk</text>
  <rect x="20" y="320" width="180" height="70" rx="10" fill="#d9f0ea" stroke="#0f7b6c" stroke-width="2.5"/>
  <text x="110" y="344" text-anchor="middle" font-weight="800" font-size="15" style="fill:#0b5c51">Main Assistant</text>
  <text x="110" y="363" text-anchor="middle" font-size="13">keeps working</text>
  <text x="110" y="380" text-anchor="middle" font-size="12">its questions: ! on its tab</text>
  <rect x="370" y="320" width="190" height="70" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="3"/>
  <text x="465" y="344" text-anchor="middle" font-weight="800" font-size="15">Job agent</text>
  <text x="465" y="363" text-anchor="middle" font-size="13" font-weight="700">FOCUSED</text>
  <text x="465" y="380" text-anchor="middle" font-size="12">talks with you</text>
  <line x1="368" y1="370" x2="204" y2="370" stroke="#6f6d66" stroke-width="2.5" marker-end="url(#aG)"/>
  <text x="285" y="346" text-anchor="middle" font-size="12" style="fill:#3d3c38">STATUS: one line</text>
  <text x="285" y="361" text-anchor="middle" font-size="12" style="fill:#3d3c38">still goes here</text>
  <text x="20" y="426" font-size="13">Switch by a tab click, or by saying yes to the suggestion.</text>
  <text x="20" y="446" font-size="13">One agent, two kinds of message: talk to you, STATUS to the MA.</text>
  </g>
</svg>
