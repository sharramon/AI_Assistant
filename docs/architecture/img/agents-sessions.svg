<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" aria-label="CLAUDE.md per session and call flows">
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; }
  </style>
  <rect x="0" y="0" width="1100" height="560" fill="#fbfaf7"/>
  <defs>
    <marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55534d"/></marker>
    <marker id="t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7c7a"/></marker>
  </defs>
  <g font-size="14">
    <rect x="20" y="55" width="100" height="56" rx="10" fill="#e6f0f7" stroke="#2f6f9f" stroke-width="2"/>
    <text x="70" y="88" text-anchor="middle" font-size="17">You</text>
    <!-- Talker -->
    <rect x="150" y="20" width="230" height="130" rx="10" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="164" y="44" font-size="17" font-weight="700">Talker</text>
    <text x="164" y="66">works in: the repo</text>
    <text x="164" y="84">loads: repo CLAUDE.md</text>
    <text x="164" y="102" fill="#0f7c7a" font-weight="600">  + the short overview only</text>
    <text x="164" y="124" fill="#0f7c7a" font-weight="600">small, and flat</text>
    <!-- Hub -->
    <rect x="410" y="55" width="130" height="60" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2"/>
    <text x="475" y="78" text-anchor="middle" font-size="16" font-weight="700">Agent Hub</text>
    <text x="475" y="96" text-anchor="middle" font-size="11" fill="#6f6d66">coordination only</text>
    <!-- Main -->
    <rect x="570" y="20" width="260" height="130" rx="10" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="584" y="44" font-size="17" font-weight="700">Main Assistant</text>
    <text x="584" y="66">works in: the repo</text>
    <text x="584" y="84">loads: repo CLAUDE.md</text>
    <text x="584" y="102" fill="#0f7c7a" font-weight="600">  + the short overview only</text>
    <text x="584" y="124" fill="#0f7c7a" font-weight="600">a module's API: its docs page,</text>
    <text x="584" y="141" fill="#0f7c7a" font-weight="600">read when it works on it</text>
    <!-- CLAUDE.md -->
    <rect x="860" y="20" width="230" height="150" rx="10" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="874" y="44" font-size="16" font-weight="700">repo CLAUDE.md imports</text>
    <text x="874" y="66" fill="#0f7c7a" font-weight="600">the short overview only</text>
    <text x="874" y="84">API index: the core only</text>
    <text x="874" y="102">each module's API: on its</text>
    <text x="874" y="120">  own docs page, in its folder</text>
    <text x="874" y="146" fill="#0f7c7a" font-weight="600">flat however many modules</text>
    <!-- Core: door · gate · Callers -->
    <rect x="560" y="185" width="320" height="128" rx="10" fill="#fff" stroke="#55534d" stroke-width="3"/>
    <text x="574" y="205" font-size="15" font-weight="700">Core · drawn in full in picture 3</text>
    <text x="574" y="224" font-size="12">D1 door → D4 one gate → the module's item</text>
    <text x="574" y="242" font-size="12">D2 Callers · D3 Router · how they talk: picture 2</text>
    <text x="574" y="260" font-size="12">D6 permissions handler + cards · <tspan fill="#b8660b" font-weight="700">≠1 to ≠6: picture 3</tspan></text>
    <rect x="575" y="272" width="290" height="32" rx="6" fill="#e6f0f7" stroke="#2f6f9f"/>
    <text x="720" y="293" text-anchor="middle" font-size="13">Bus · D5, in the core: typed and named events</text>
    <!-- Modules -->
    <rect x="560" y="325" width="320" height="135" rx="10" fill="#fff" stroke="#55534d" stroke-width="2"/>
    <text x="574" y="348" font-size="16" font-weight="700">Modules (all in the repo)</text>
    <rect x="575" y="358" width="290" height="30" rx="6" fill="#f1f0ec" stroke="#55534d"/>
    <text x="585" y="378" font-size="13">core: what the app can't start without + ports</text>
    <rect x="575" y="396" width="290" height="44" rx="6" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="585" y="413" font-size="13">add-ons: code; agents' workspaces gitignored</text>
    <text x="585" y="431" font-size="13" fill="#0f7c7a" font-weight="600">3 rules, checked by tests (picture 1)</text>
    <text x="574" y="454" font-size="11.5" fill="#6f6d66">each other only through the core above, never an import</text>
    <!-- cv_agent -->
    <rect x="150" y="190" width="320" height="125" rx="10" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="164" y="214" font-size="17" font-weight="700">cv_agent</text>
    <text x="164" y="236" font-size="13" fill="#0f7c7a" font-weight="600">works in: its workspace (box below)</text>
    <text x="164" y="254" font-size="13" fill="#0f7c7a" font-weight="600">--settings claudeMdExcludes: [repo CLAUDE.md]</text>
    <text x="164" y="274" font-size="13">loads: the short developer-rules file</text>
    <text x="164" y="294" font-size="13" fill="#0f7c7a" font-weight="600">write grant: modules/cv/ (its own code)</text>
    <!-- job agent -->
    <rect x="150" y="335" width="320" height="125" rx="10" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="164" y="359" font-size="17" font-weight="700">job_search_agent</text>
    <text x="164" y="381" font-size="13" fill="#0f7c7a" font-weight="600">works in: its workspace (box below)</text>
    <text x="164" y="399" font-size="13" fill="#0f7c7a" font-weight="600">--settings claudeMdExcludes: [repo CLAUDE.md]</text>
    <text x="164" y="417" font-size="13">loads: rules file + its profile CLAUDE.md</text>
    <text x="164" y="437" font-size="13" fill="#0f7c7a" font-weight="600">write grant: modules/job_search/</text>
    <!-- Workspace -->
    <rect x="150" y="480" width="320" height="66" rx="10" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="164" y="502" font-size="15" font-weight="700">Workspace: modules/&lt;id&gt;/workspace</text>
    <text x="164" y="522" font-size="13">CVs · job state · applications · outputs</text>
    <text x="164" y="539" font-size="13" fill="#6f6d66">gitignored · or your data folder, if config names one</text>
    <rect x="560" y="480" width="320" height="66" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2"/>
    <text x="574" y="502" font-size="15" font-weight="700">config/cv.toml · config/job_search.toml</text>
    <text x="574" y="522" font-size="13">data_folder = "…" (yours, gitignored)</text>
    <text x="574" y="539" font-size="13" fill="#6f6d66">no script names a real path</text>
    <!-- arrows -->
    <g stroke="#55534d" stroke-width="2.5" fill="none">
      <line x1="120" y1="83" x2="148" y2="83" marker-end="url(#g2)"/>
      <line x1="380" y1="85" x2="408" y2="85" marker-end="url(#g2)"/>
      <line x1="540" y1="85" x2="568" y2="85" marker-end="url(#g2)"/>
      <line x1="700" y1="150" x2="700" y2="183" marker-end="url(#g2)"/>
      <line x1="700" y1="313" x2="700" y2="323" marker-end="url(#g2)"/>
      <path d="M472 400 L545 400 L545 225 L558 225" marker-end="url(#g2)"/>
      <line x1="472" y1="300" x2="545" y2="300"/>
      <path d="M490 115 L490 245 L473 245" stroke-dasharray="6 4" marker-end="url(#g2)"/>
      <path d="M472 272 L515 272 L515 118" stroke-dasharray="6 4" marker-end="url(#g2)"/>
      <line x1="558" y1="513" x2="473" y2="513" stroke="#0f7c7a" marker-end="url(#t2)"/>
    </g>
    <g font-size="12" fill="#6f6d66">
      <text x="384" y="76">work</text>
      <text x="708" y="172">list · menu · use</text>
      <text x="484" y="172" text-anchor="end">hub.start · hub.send: door → gate → Hub's menu ⇣</text>
      <text x="521" y="163" font-size="11">⇡ STATUS line → Hub report</text>
      <text x="521" y="178" font-size="11">→ Main's next turn (feed)</text>
      <text x="480" y="393">same door</text>
      <text x="485" y="506" fill="#0f7c7a">points at</text>
    </g>
  </g>
</svg>
