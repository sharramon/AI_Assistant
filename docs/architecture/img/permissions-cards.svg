<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" aria-label="How a permission card travels through the core">
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; }
  </style>
  <rect x="0" y="0" width="1000" height="600" fill="#fbfaf7"/>
  <defs>
    <marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55534d"/></marker>
    <marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker>
    <marker id="pp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
    <marker id="php" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#fff" stroke="#6b4fa0" stroke-width="1.5"/></marker>
    <marker id="phc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#fff" stroke="#55534d" stroke-width="1.5"/></marker>
  </defs>
  <g font-size="13">
    <!-- who asks -->
    <rect x="20" y="60" width="210" height="190" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="34" y="84" font-size="15" font-weight="700">Who asks</text>
    <text x="34" y="106" font-size="12">an agent's call to a menu item</text>
    <text x="34" y="122" font-size="12">marked ask (through the door)</text>
    <text x="34" y="150" font-size="12">a module's own code:</text>
    <text x="34" y="166" font-size="12">ctx.permissions.confirm</text>
    <text x="34" y="182" font-size="12">request_set (an access list)</text>
    <text x="34" y="198" font-size="12">ask (a message between agents)</text>
    <text x="34" y="222" font-size="12">the permissions.* grant calls</text>

    <!-- good to know -->
    <rect x="20" y="280" width="210" height="250" rx="10" fill="#fff" stroke="#b8660b" stroke-width="2"/>
    <text x="34" y="302" font-size="14" font-weight="700">Good to know</text>
    <g font-size="12">
      <text x="34" y="324" fill="#b8660b" font-weight="600">≠1 confirm cards show in Auto</text>
      <text x="34" y="340">too: modules.add, remove,</text>
      <text x="34" y="356">reload, off with dependents</text>
      <text x="34" y="380" fill="#b8660b" font-weight="600">≠5 modules.off without</text>
      <text x="34" y="396">dependents asks nothing</text>
      <text x="34" y="420" fill="#b8660b" font-weight="600">≠6 an off start_on_use module</text>
      <text x="34" y="436">starts before the callers check</text>
      <text x="34" y="460" font-weight="600">Auto, other cards:</text>
      <text x="34" y="476">grant, request, revoke and</text>
      <text x="34" y="492">messages run with no card; an</text>
      <text x="34" y="508">access list is allowed for this</text>
      <text x="34" y="524">launch, not saved</text>
    </g>

    <!-- core -->
    <rect x="250" y="20" width="470" height="520" rx="12" fill="#f1f0ec" stroke="#55534d" stroke-width="2.5"/>
    <text x="265" y="44" font-size="17" font-weight="700">Core: every card passes here</text>

    <rect x="270" y="60" width="430" height="70" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="282" y="82" font-size="15" font-weight="700">One gate: dispatch_tool · D4</text>
    <text x="282" y="102" font-size="12">an item marked ask: its arguments and callers checked,</text>
    <text x="282" y="120" font-size="12">then it asks the handler (3); a “you” caller runs at once</text>

    <rect x="270" y="160" width="280" height="150" rx="8" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
    <text x="282" y="182" font-size="15" font-weight="700">Permissions handler · D6</text>
    <text x="282" y="202" font-size="12">cards: access · grant · revoke ·</text>
    <text x="282" y="218" font-size="12">message · confirm</text>
    <text x="282" y="238" font-size="12">Auto or Manual? asks Callers (4)</text>
    <text x="282" y="258" font-size="12">on Allow: saves the grant or runs</text>
    <text x="282" y="274" font-size="12">the step; the agent gets a note</text>
    <text x="282" y="296" font-size="12" fill="#b8660b" font-weight="600">≠2 the gate already answered</text>

    <rect x="570" y="160" width="130" height="70" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="580" y="182" font-size="14" font-weight="700">Callers · D2</text>
    <text x="580" y="200" font-size="12">each agent's mode</text>
    <text x="580" y="216" font-size="12" fill="#0f7c7a" font-weight="600">Auto only from you</text>

    <rect x="270" y="350" width="430" height="50" rx="8" fill="#fff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="282" y="372" font-size="15" font-weight="700">Bus · D5</text>
    <text x="350" y="372" font-size="12">PermissionRequested: the card (7, 8)</text>
    <text x="350" y="390" font-size="12">PermissionChanged: closes it</text>

    <rect x="270" y="430" width="430" height="90" rx="8" fill="#fff" stroke="#55534d" stroke-width="2"/>
    <text x="282" y="452" font-size="15" font-weight="700">Router · D3</text>
    <text x="282" y="472" font-size="12">9 AnswerPermissionRequest: only from a “you” caller</text>
    <text x="282" y="490" font-size="12">or a relay (the Talker, ≠4), then to the handler (10)</text>
    <text x="282" y="508" font-size="12" fill="#0f7c7a" font-weight="600">sender stamped on every command</text>

    <!-- modules -->
    <rect x="740" y="230" width="240" height="90" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="752" y="252" font-size="15" font-weight="700">Agent Hub · Reviewer</text>
    <text x="752" y="272" font-size="12">a short task on the reviewer</text>
    <text x="752" y="288" font-size="12">(main_assistant), 90 s at most</text>
    <text x="752" y="306" font-size="12" fill="#b8660b" font-weight="600">≠3 the review is a Hub task</text>

    <rect x="740" y="340" width="240" height="150" rx="8" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="752" y="362" font-size="15" font-weight="700">temp_ui · Talker</text>
    <text x="752" y="382" font-size="12">temp_ui: the card with tick boxes</text>
    <text x="752" y="398" font-size="12">and buttons (a “you” caller)</text>
    <text x="752" y="418" font-size="12">Talker: reads it out, sends your</text>
    <text x="752" y="434" font-size="12">ALLOW / DENY (a relay)</text>
    <text x="752" y="456" font-size="12" fill="#b8660b" font-weight="600">≠4 whether the Talker's answers</text>
    <text x="752" y="472" font-size="12" fill="#b8660b" font-weight="600">count as yours: G17, open</text>

    <rect x="740" y="510" width="240" height="40" rx="10" fill="#e6f0f7" stroke="#2f6f9f" stroke-width="2"/>
    <text x="860" y="536" text-anchor="middle" font-size="16">You</text>

    <!-- arrows -->
    <line x1="230" y1="96" x2="268" y2="96" stroke="#55534d" stroke-width="2" marker-end="url(#pc)"/>
    <text x="244" y="90" font-size="12" font-weight="700">1</text>
    <line x1="230" y1="200" x2="268" y2="200" stroke="#6b4fa0" stroke-width="2.5" marker-end="url(#pp)"/>
    <text x="244" y="194" font-size="12" font-weight="700" fill="#6b4fa0">2</text>
    <line x1="400" y1="130" x2="400" y2="158" stroke="#6b4fa0" stroke-width="2.5" marker-end="url(#pp)"/>
    <text x="408" y="149" font-size="12" font-weight="700" fill="#6b4fa0">3</text>
    <line x1="552" y1="190" x2="568" y2="190" stroke="#6b4fa0" stroke-width="2.5" marker-end="url(#pp)"/>
    <line x1="568" y1="212" x2="552" y2="212" stroke="#6b4fa0" stroke-width="2" marker-end="url(#php)"/>
    <line x1="550" y1="280" x2="738" y2="280" stroke="#55534d" stroke-width="2" marker-end="url(#pc)"/>
    <text x="562" y="273" font-size="12">5 ReviewAccessList</text>
    <line x1="738" y1="298" x2="552" y2="298" stroke="#55534d" stroke-width="2" marker-end="url(#phc)"/>
    <text x="562" y="316" font-size="12">6 AddCardNotes</text>
    <text x="562" y="334" font-size="11" fill="#55534d">(both commands, via the router)</text>
    <line x1="400" y1="310" x2="400" y2="348" stroke="#2f6f9f" stroke-width="2.5" marker-end="url(#pb)"/>
    <text x="408" y="334" font-size="12" font-weight="700" fill="#2f6f9f">7</text>
    <line x1="700" y1="375" x2="738" y2="375" stroke="#2f6f9f" stroke-width="2.5" marker-end="url(#pb)"/>
    <text x="712" y="368" font-size="12" font-weight="700" fill="#2f6f9f">8</text>
    <line x1="860" y1="492" x2="860" y2="508" stroke="#2f6f9f" stroke-width="2" marker-start="url(#pb)" marker-end="url(#pb)"/>
    <line x1="738" y1="470" x2="702" y2="470" stroke="#55534d" stroke-width="2" marker-end="url(#pc)"/>
    <text x="712" y="463" font-size="12" font-weight="700">9</text>
    <path d="M270,500 H258 V250 H268" fill="none" stroke="#55534d" stroke-width="2" marker-end="url(#pc)"/>

    <!-- legend -->
    <g font-size="12">
      <line x1="20" y1="578" x2="56" y2="578" stroke="#6b4fa0" stroke-width="2.5" marker-end="url(#pp)"/>
      <text x="64" y="582">permission question</text>
      <line x1="200" y1="578" x2="236" y2="578" stroke="#6b4fa0" stroke-width="2" marker-end="url(#php)"/>
      <text x="244" y="582">its answer</text>
      <line x1="330" y1="578" x2="366" y2="578" stroke="#2f6f9f" stroke-width="2.5" marker-end="url(#pb)"/>
      <text x="374" y="582">event on the bus</text>
      <line x1="500" y1="578" x2="536" y2="578" stroke="#55534d" stroke-width="2" marker-end="url(#pc)"/>
      <text x="544" y="582">command or call (through the router)</text>
    </g>
  </g>
</svg>
