<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" aria-label="Rules for the core line: the core box, add-ons that talk only through tools, events and contracts, and arrows that point one way">
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; }
  </style>
  <rect x="0" y="0" width="1100" height="300" fill="#fbfaf7"/>
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7c7a"/></marker>
    <marker id="tb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0f7c7a"/></marker>
  </defs>
  <g font-size="15">
    <!-- rule 1: the core box -->
    <rect x="10" y="20" width="340" height="260" rx="12" fill="#f1f0ec" stroke="#55534d" stroke-width="3"/>
    <text x="26" y="50" font-size="19" font-weight="700">Core</text>
    <circle cx="326" cy="44" r="11" fill="#0f7c7a"/><text x="326" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="26" y="76" fill="#6f6d66">what the app can't start without:</text>
    <text x="26" y="104">• the host</text>
    <text x="26" y="128">• the core modules</text>
    <text x="26" y="152">• the door + one gate</text>
    <text x="26" y="176">• 7 ports: lifecycle · commands ·</text>
    <text x="40" y="198">events · contracts · directory ·</text>
    <text x="40" y="220">permissions · callers</text>
    <text x="26" y="262" font-size="13" fill="#6f6d66">names no add-on (tests/test_boundaries.py)</text>

    <!-- the two add-ons (dashed, as in the legend) -->
    <rect x="540" y="40" width="170" height="200" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="625" y="68" text-anchor="middle" font-size="14" fill="#6f6d66">add-on</text>
    <text x="625" y="90" text-anchor="middle" font-size="17" font-weight="700">job_search</text>
    <rect x="960" y="40" width="130" height="200" rx="10" fill="#fff" stroke="#8a877c" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="1025" y="68" text-anchor="middle" font-size="14" fill="#6f6d66">add-on</text>
    <text x="1025" y="90" text-anchor="middle" font-size="17" font-weight="700">cv</text>

    <!-- rule 3: add-on → core (needs) -->
    <line x1="538" y1="110" x2="353" y2="110" stroke="#0f7c7a" stroke-width="3" marker-end="url(#ta)"/>
    <circle cx="414" cy="94" r="10" fill="#0f7c7a"/><text x="414" y="98.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="430" y="99" font-size="14" fill="#0f7c7a">needs ✓</text>

    <!-- rule 3: core → add-on, crossed out -->
    <line x1="353" y1="190" x2="422" y2="190" stroke="#c0392b" stroke-width="3"/>
    <path d="M422,183 L432,190 L422,197 z" fill="#c0392b"/>
    <line x1="438" y1="180" x2="458" y2="200" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <line x1="458" y1="180" x2="438" y2="200" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="368" cy="226" r="10" fill="#0f7c7a"/><text x="368" y="230.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="384" y="231" font-size="14" fill="#c0392b">core never names</text>
    <text x="384" y="249" font-size="14" fill="#c0392b">an add-on</text>

    <!-- rule 3: job_search → cv (needs) -->
    <line x1="712" y1="90" x2="957" y2="90" stroke="#0f7c7a" stroke-width="3" marker-end="url(#ta)"/>
    <circle cx="790" cy="74" r="10" fill="#0f7c7a"/><text x="790" y="78.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="806" y="79" font-size="14" fill="#0f7c7a">needs ✓</text>

    <!-- rule 2: add-on ↔ add-on, only tools · events · contracts -->
    <line x1="715" y1="148" x2="955" y2="148" stroke="#0f7c7a" stroke-width="3" marker-start="url(#tb)" marker-end="url(#ta)"/>
    <circle cx="728" cy="131" r="10" fill="#0f7c7a"/><text x="728" y="135.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="744" y="136" font-size="13.5" fill="#0f7c7a">tools · events · contracts only</text>

    <!-- rule 2: importing the other's code, crossed out -->
    <line x1="712" y1="205" x2="792" y2="205" stroke="#c0392b" stroke-width="3"/>
    <path d="M792,198 L802,205 L792,212 z" fill="#c0392b"/>
    <line x1="808" y1="195" x2="828" y2="215" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <line x1="828" y1="195" x2="808" y2="215" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <text x="840" y="210" font-size="14" fill="#c0392b">import code</text>
  </g>
</svg>
