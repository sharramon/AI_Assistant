  <rect x="1026" y="360" width="150" height="120" rx="12" fill="#fff" stroke="#3b8a52" stroke-width="3"/>
  <rect x="1026" y="360" width="150" height="26" rx="12" fill="#e3f1e6"/>
  <rect x="1036" y="366" width="62" height="16" rx="4" fill="#fff" stroke="#3b8a52"/>
  <rect x="1042" y="400" width="110" height="10" rx="5" fill="#dbe9f4"/>
