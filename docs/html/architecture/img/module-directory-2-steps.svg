  <text x="712" y="423" class="sm">open a page in a tab</text>
  <text x="712" y="439" class="sm" style="font-style:italic">in: path</text>
  <rect x="700" y="452" width="238" height="60" rx="8" fill="#fff"/>
  <text x="712" y="472" style="font-size:15px;font-weight:700">highlight</text>
  <text x="712" y="489" class="sm">mark words on a page</text>
  <text x="712" y="505" class="sm" style="font-style:italic">in: path, text, heading</text>
