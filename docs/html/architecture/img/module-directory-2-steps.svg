  <text x="780" y="336" class="wt" style="font-size:17px">html_viewer</text>
  <rect x="600" y="348" width="360" height="246" rx="16" fill="#fff"/>
  <text x="640" y="470" font-size="36" text-anchor="middle">🖼</text>
  <text x="640" y="500" class="sm" text-anchor="middle">work</text>
