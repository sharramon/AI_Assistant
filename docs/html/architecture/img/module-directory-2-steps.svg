  <text x="670" y="203" class="lb">agent_hub</text>
  <text x="800" y="203" class="sm" style="font-size:15px">runs tasks</text>

  <use href="#modNew" x="606" y="229"/>
  <text x="670" y="253" class="lb" style="fill:#2f6f9f">new module</text>
  <text x="800" y="253" class="sm" style="font-size:15px">one line</text>

  <line x1="468" y1="318" x2="684" y2="372" stroke="#c0661b" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#aO)"/>
