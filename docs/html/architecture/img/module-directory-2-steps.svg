  <rect x="800" y="632" width="120" height="40" rx="20" fill="#fff4cc" stroke="#c9a227" stroke-width="2"/>
  <text x="860" y="658" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#7a5d00">MCP-like</text>
