<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agents use the module door; the core routes to a module's menu; workers report back by events">
  <style>text { font-family: "Segoe UI", system-ui, sans-serif; fill: #1d1d1b; }</style>
  <defs>
    <marker id="cM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8327e"/></marker>
  </defs>
  <rect width="1200" height="400" fill="#ffffff"/>

  <rect x="250" y="16" width="700" height="44" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="2"/>
  <text x="600" y="44" text-anchor="middle" font-weight="700" font-size="15">Every agent (Main Assistant, job agent, …) and their Talkers (one per tab)</text>
  <line x1="600" y1="60" x2="600" y2="96" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#cM)"/>

  <rect x="350" y="98" width="500" height="72" rx="10" fill="#fbeef6" stroke="#a8327e" stroke-width="2.5"/>
  <text x="600" y="124" text-anchor="middle" font-weight="800" font-size="16">The module door</text>
  <text x="600" y="145" text-anchor="middle" font-size="14">list · menu · use item</text>
  <text x="600" y="162" text-anchor="middle" font-size="11" style="fill:#8a877c">hosted by the Hub · carried over MCP · each caller proved by its token</text>
  <line x1="600" y1="170" x2="600" y2="206" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-start="url(#cM)" marker-end="url(#cM)"/>

  <rect x="100" y="208" width="1000" height="48" rx="10" fill="#efeaf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="600" y="238" text-anchor="middle" font-size="15"><tspan font-weight="800" style="fill:#4b3577">Core:</tspan> directory · tool call · item callers · permissions · events · lifecycle</text>

  <line x1="345" y1="256" x2="345" y2="296" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-start="url(#cM)" marker-end="url(#cM)"/>
  <text x="353" y="282" font-size="13" style="fill:#8a2766">to that menu item · result back</text>
  <line x1="545" y1="298" x2="545" y2="258" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#cM)"/>
  <text x="553" y="282" font-size="13" style="fill:#8a2766">worker done: AgentNotice</text>

  <rect x="100" y="298" width="540" height="84" rx="10" fill="#dbe9f4" stroke="#2f6f9f" stroke-width="2.5"/>
  <text x="168" y="330" text-anchor="middle" font-weight="800" font-size="14" style="fill:#1f4f73">job_search</text>
  <text x="168" y="350" text-anchor="middle" font-size="12">wrapper +</text>
  <text x="168" y="366" text-anchor="middle" font-size="12">the job agent</text>
  <rect x="240" y="310" width="210" height="60" rx="8" fill="#fff3a8" stroke="#c9a800" stroke-width="2"/>
  <text x="345" y="334" text-anchor="middle" font-weight="800" font-size="13">Menu</text>
  <text x="345" y="354" text-anchor="middle" font-size="12">job.search (more items later)</text>
  <rect x="462" y="310" width="166" height="60" rx="8" fill="#f2f1ee" stroke="#8a877c" stroke-width="2"/>
  <text x="545" y="334" text-anchor="middle" font-weight="800" font-size="13">Background worker</text>
  <text x="545" y="354" text-anchor="middle" font-size="12">the sweep (stub runner)</text>

  <rect x="660" y="298" width="210" height="84" rx="10" fill="#f2f1ee" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="765" y="332" text-anchor="middle" font-weight="800" font-size="14" style="fill:#5f5e58">next agent's module</text>
  <text x="765" y="354" text-anchor="middle" font-size="12" style="fill:#5f5e58">same shape (later)</text>

  <rect x="890" y="298" width="210" height="84" rx="10" fill="#dbe9f4" stroke="#2f6f9f" stroke-width="2"/>
  <text x="995" y="332" text-anchor="middle" font-weight="800" font-size="14" style="fill:#1f4f73">ordinary modules</text>
  <text x="995" y="354" text-anchor="middle" font-size="12">viewer, voice, …: anyone's tools</text>
</svg>
