    <g stroke="#b8660b" stroke-width="2.5" fill="none" stroke-dasharray="5 4">
      <line x1="815" y1="300" x2="858" y2="222" marker-end="url(#b3a)"/>
      <line x1="815" y1="318" x2="858" y2="392" marker-end="url(#b3a)"/>
    </g>
    <!-- gap: a file path past the door -->
    <line x1="965" y1="488" x2="965" y2="522" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#b3r)"/>
    <text x="975" y="510" font-size="12" fill="#c0392b" font-weight="600">by file path</text>
    <!-- labels -->
    <g font-size="11" font-weight="600" fill="#6b4fa0">
      <text x="324" y="266">mode?</text>
      <text x="404" y="266">Manual / Auto</text>
      <text x="531" y="266" text-anchor="end">may it?</text>
    </g>
