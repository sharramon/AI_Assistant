      <line x1="545" y1="230" x2="545" y2="288" marker-end="url(#b3p)"/>
      <line x1="390" y1="238" x2="390" y2="288" stroke-dasharray="6 4" marker-end="url(#b3hp)"/>
      <line x1="590" y1="290" x2="590" y2="232" stroke-dasharray="6 4" marker-end="url(#b3hp)"/>
    </g>
    <path d="M815 462 L822 462 L822 372 L817 372" stroke="#55534d" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#b3hc)"/>
