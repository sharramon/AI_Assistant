    <g stroke="#0f7c7a" stroke-width="2.5" fill="none" stroke-dasharray="7 4">
      <line x1="250" y1="566" x2="283" y2="566" marker-end="url(#b3t)"/>
      <line x1="815" y1="566" x2="858" y2="566" marker-end="url(#b3t)"/>
