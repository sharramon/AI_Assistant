<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" aria-label="An add-on outside the repo, found and reached through the same core">
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; }
  </style>
  <rect x="0" y="0" width="1100" height="640" fill="#fbfaf7"/>
  <defs>
    <marker id="b3t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f7c7a"/></marker>
    <marker id="b3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55534d"/></marker>
    <marker id="b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker>
    <marker id="b3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
    <marker id="b3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8660b"/></marker>
    <marker id="b3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="b3hp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#fff" stroke="#6b4fa0" stroke-width="1.5"/></marker>
    <marker id="b3hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#fff" stroke="#55534d" stroke-width="1.5"/></marker>
  </defs>
  <g font-size="13">
    <!-- callers -->
    <rect x="20" y="20" width="230" height="44" rx="10" fill="#e6f0f7" stroke="#2f6f9f" stroke-width="2"/>
    <text x="135" y="48" text-anchor="middle" font-size="17">You</text>
    <rect x="20" y="84" width="230" height="76" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="34" y="108" font-size="16" font-weight="700">Talker</text>
    <text x="34" y="130" font-size="12" fill="#b8660b" font-weight="600">≠4 may answer cards too</text>
    <text x="34" y="148" font-size="12" fill="#b8660b" font-weight="600">(picture 3) · G17, yours</text>
    <rect x="20" y="174" width="230" height="56" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="34" y="208" font-size="16" font-weight="700">Main Assistant</text>
    <rect x="20" y="244" width="230" height="84" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="34" y="268" font-size="16" font-weight="700">Helpers</text>
    <text x="34" y="290" font-size="12">cv_agent · job agent · task_agents</text>
    <text x="34" y="310" font-size="12" fill="#c0392b" font-weight="600">!5 CLAUDE.md excludes: repo only</text>
    <rect x="20" y="420" width="230" height="64" rx="10" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="34" y="444" font-size="16" font-weight="700">temp_ui</text>
    <text x="34" y="466">a "you" caller in Callers</text>
    <rect x="20" y="530" width="230" height="86" rx="10" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="34" y="552" font-size="15" font-weight="700">Module folders</text>
    <text x="34" y="572" font-size="12">repo: src/assistant/modules/</text>
    <text x="34" y="590" font-size="12" fill="#0f7c7a" font-weight="600">+ [core] module_folders =</text>
    <text x="34" y="607" font-size="12" fill="#0f7c7a" font-weight="600">  ["C:/AddOns"]</text>

    <!-- core -->
    <rect x="270" y="20" width="555" height="600" rx="12" fill="#f1f0ec" stroke="#55534d" stroke-width="2.5"/>
    <text x="285" y="44" font-size="17" font-weight="700">Core: every call and every card passes here</text>
    <rect x="285" y="60" width="220" height="80" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="297" y="80" font-size="15" font-weight="700">Module door · D1</text>
    <text x="297" y="98" fill="#0f7c7a" font-weight="600">list · menu · use, both folders</text>
    <text x="297" y="116" font-size="12" fill="#0f7c7a" font-weight="600">✓ caller proved by its token</text>
    <text x="297" y="132" font-size="12" fill="#0f7c7a" font-weight="600">✓ no module may name another</text>
    <rect x="285" y="152" width="220" height="84" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="297" y="172" font-size="15" font-weight="700">Callers (port) · D2</text>
    <text x="297" y="190">names · kinds · each mode</text>
    <text x="297" y="207" fill="#c0392b" font-weight="600">"you" by module id, not folder</text>
    <text x="297" y="225" fill="#0f7c7a" font-weight="600">✓ Auto set only by "you"</text>
    <rect x="520" y="60" width="295" height="170" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="532" y="80" font-size="15" font-weight="700">One gate: dispatch_tool · D4</text>
    <text x="532" y="101" fill="#b8660b" font-weight="600">0 starts an off start_on_use module</text>
    <text x="532" y="119">1 caller proved (token or module id)</text>
    <text x="532" y="137">2 item callers + argument schema</text>
    <text x="532" y="155">3 risky item: asks the handler (7)</text>
    <text x="532" y="173">4 sender stamped on the call</text>
    <text x="532" y="195" fill="#0f7c7a" font-weight="600">✓ the same for either folder</text>
    <text x="532" y="216" font-size="12" fill="#b8660b" font-weight="600">0 runs before 1</text>
    <rect x="640" y="240" width="175" height="42" rx="6" fill="#fff" stroke="#55534d" stroke-width="1.5"/>
    <text x="650" y="256" font-size="12.5" font-weight="700">Core menu</text>
    <text x="650" y="274" font-size="12">modules.on · off · add · …</text>
    <rect x="285" y="290" width="530" height="94" rx="8" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
    <text x="297" y="310" font-size="15" font-weight="700">Permissions handler + cards · D6</text>
    <text x="297" y="329" fill="#0f7c7a" font-weight="600">✓ the same cards for an outside add-on and its agent's folders</text>
    <text x="330" y="350" fill="#b8660b" font-weight="600">the gate already answered; the step runs after your Allow</text>
    <text x="330" y="372" fill="#b8660b" font-weight="600">the review is a task the Hub starts; its notes come back</text>
    <rect x="285" y="396" width="530" height="40" rx="8" fill="#fff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="297" y="421" font-size="15" font-weight="700">Bus · D5</text>
    <text x="372" y="421" fill="#0f7c7a" font-weight="600">✓ publishes strict · events only notify, never control</text>
    <rect x="285" y="450" width="530" height="56" rx="8" fill="#fff" stroke="#55534d" stroke-width="2"/>
    <text x="297" y="470" font-size="15" font-weight="700">Router · D3</text>
    <text x="297" y="491" fill="#0f7c7a" font-weight="600">✓ sender stamped · sends strict · control commands only from "you"</text>
    <rect x="285" y="526" width="530" height="80" rx="8" fill="#fff" stroke="#0f7c7a" stroke-width="2.5"/>
    <text x="297" y="546" font-size="15" font-weight="700">loader.find_modules → LifecycleManager</text>
    <text x="297" y="565" font-size="12.5">adds C:/AddOns to assistant.modules.__path__ · the same id check</text>
    <text x="297" y="582" font-size="12.5">keeps every class, on or off · on: init · link_menu · start (A9)</text>
    <text x="297" y="599" font-size="12.5" fill="#c0392b" font-weight="600">"found in two folders": checked at startup only</text>

    <!-- modules -->
    <rect x="845" y="20" width="240" height="600" rx="12" fill="#fff" stroke="#55534d" stroke-width="2.5"/>
    <text x="860" y="44" font-size="17" font-weight="700">Modules</text>
    <rect x="860" y="60" width="210" height="180" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2"/>
    <text x="872" y="80" font-size="15" font-weight="700">Agent Hub</text>
    <text x="872" y="98" font-weight="600">coordination only</text>
    <text x="872" y="120">task board · status · cancel</text>
    <text x="872" y="138">focus · held questions</text>
    <text x="872" y="156">delivery · message hold</text>
    <text x="872" y="174">milestones to the coordinator</text>
    <text x="872" y="192">hub.* menu</text>
    <text x="872" y="214" fill="#b8660b" font-weight="600">≠3 starts the review task</text>
    <text x="872" y="232" font-size="12" fill="#6f6d66">no door, no names, no mode</text>
    <rect x="860" y="254" width="210" height="100" rx="8" fill="#f1f0ec" stroke="#55534d" stroke-width="2"/>
    <text x="872" y="274" font-size="15" font-weight="700">Core modules (repo)</text>
    <text x="872" y="294">talker · main_assistant</text>
    <text x="872" y="312">task_agents · temp_ui · usage</text>
    <text x="872" y="330">console_io · assistant_view</text>
    <text x="872" y="346">voice_in</text>
    <rect x="860" y="368" width="210" height="236" rx="8" fill="#e3f4f3" stroke="#0f7c7a" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="872" y="388" font-size="15" font-weight="700">C:/AddOns/ (outside)</text>
    <text x="872" y="406" font-size="12">html_viewer · voice_notes · echo</text>
    <text x="872" y="424" font-size="12" fill="#0f7c7a" font-weight="600">each: its own CLAUDE.md</text>
    <text x="872" y="442" font-size="12" fill="#c0392b" font-weight="600">!1 a core id here gets your rights</text>
    <rect x="872" y="454" width="186" height="34" rx="6" fill="#fff" stroke="#9a6b2f" stroke-width="2"/>
    <text x="884" y="476" font-weight="700">job_search</text>
    <rect x="872" y="524" width="186" height="34" rx="6" fill="#fff" stroke="#7a5c99" stroke-width="2"/>
    <text x="884" y="546" font-weight="700">cv · its output folder</text>

