    <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
      <rect x="252" y="546" width="26" height="18" rx="9" fill="#0f7c7a"/><text x="265" y="559">A1</text>
      <rect x="823" y="546" width="26" height="18" rx="9" fill="#0f7c7a"/><text x="836" y="559">A9</text>
    </g>
    <!-- good-to-know marks and known gaps -->
    <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
