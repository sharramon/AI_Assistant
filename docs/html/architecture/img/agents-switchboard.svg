<svg viewBox="0 0 1400 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Every agent tab has its own Talker. Two routes: messages go through the Agent Hub between you, each tab's Talker and its agent; tools go from every agent and the Talkers through the module door, hosted by the Hub, to the core and a module's menu item">
  <style>text { font-family: "Segoe UI", system-ui, sans-serif; fill: #1d1d1b; }</style>
  <defs>
    <marker id="hB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker>
    <marker id="hG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6d66"/></marker>
    <marker id="hM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8327e"/></marker>
  </defs>
  <rect width="1400" height="690" fill="#ffffff"/>

  <!-- TOOL route (dotted magenta): the module door column, beside the Hub -->
  <rect x="1200" y="16" width="185" height="60" rx="8" fill="#fff3a8" stroke="#c9a800" stroke-width="2"/>
  <text x="1292" y="40" text-anchor="middle" font-weight="800" font-size="13">a module's menu item</text>
  <text x="1292" y="60" text-anchor="middle" font-size="11">job.search · viewer.open …</text>
  <line x1="1292" y1="78" x2="1292" y2="102" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-start="url(#hM)" marker-end="url(#hM)"/>
  <rect x="1200" y="104" width="185" height="60" rx="8" fill="#efeaf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="1292" y="128" text-anchor="middle" font-weight="800" font-size="14" style="fill:#4b3577">Core</text>
  <text x="1292" y="148" text-anchor="middle" font-size="12">routes · item callers checked</text>
  <line x1="1292" y1="166" x2="1292" y2="248" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-start="url(#hM)" marker-end="url(#hM)"/>
  <text x="1302" y="196" font-size="11" style="fill:#8a2766">call ↑</text>
  <text x="1302" y="211" font-size="11" style="fill:#8a2766">results,</text>
  <text x="1302" y="226" font-size="11" style="fill:#8a2766">events ↓</text>
  <rect x="1200" y="250" width="185" height="100" rx="10" fill="#fbeef6" stroke="#a8327e" stroke-width="2.5"/>
  <text x="1292" y="274" text-anchor="middle" font-weight="800" font-size="14">The module door</text>
  <text x="1292" y="294" text-anchor="middle" font-size="13">list · menu · use item</text>
  <text x="1292" y="314" text-anchor="middle" font-size="12" font-weight="700" style="fill:#8a2766">hosted by the Hub</text>
  <text x="1292" y="334" text-anchor="middle" font-size="11" style="fill:#8a877c">carried over MCP · no chat</text>
  <path d="M1090,124 H1180 V300 H1197" fill="none" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#hM)"/>
  <text x="1096" y="112" font-size="11" style="fill:#8a2766">quick tools</text>
  <path d="M240,596 V664 H1292 V353" fill="none" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#hM)"/>
  <path d="M600,596 V664" fill="none" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <path d="M960,596 V664" fill="none" stroke="#a8327e" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.55"/>
  <text x="780" y="652" text-anchor="middle" font-size="12" style="fill:#8a2766">tool calls from every agent · no conversation</text>


  <!-- You and the Talkers, one per tab -->
  <rect x="490" y="16" width="220" height="48" rx="24" fill="#e6f0f7" stroke="#2f6f9f" stroke-width="2"/>
  <text x="600" y="46" text-anchor="middle" font-weight="800" font-size="17">You</text>
  <path d="M520,64 V80 H240 V93" fill="none" stroke="#2f6f9f" stroke-width="2.5" marker-start="url(#hB)" marker-end="url(#hB)"/>
  <line x1="600" y1="64" x2="600" y2="93" stroke="#2f6f9f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hB)"/>
  <path d="M680,64 V80 H960 V93" fill="none" stroke="#2f6f9f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hB)"/>
  <text x="760" y="76" font-size="12" style="fill:#1f4f73">click a tab</text>
  <rect x="110" y="96" width="260" height="56" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="2.5"/>
  <text x="240" y="119" text-anchor="middle" font-weight="800" font-size="15">Talker · Main tab</text>
  <text x="240" y="140" text-anchor="middle" font-size="12">talks for the Main Assistant · its chat</text>
  <rect x="470" y="96" width="260" height="56" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="2"/>
  <text x="600" y="119" text-anchor="middle" font-weight="800" font-size="15">Talker · Job tab</text>
  <text x="600" y="140" text-anchor="middle" font-size="12">talks for the job agent · its own chat</text>
  <rect x="830" y="96" width="260" height="56" rx="10" fill="#f2f1ee" stroke="#8a877c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="960" y="119" text-anchor="middle" font-weight="800" font-size="15" style="fill:#5f5e58">Talker · next tab</text>
  <text x="960" y="140" text-anchor="middle" font-size="12" style="fill:#5f5e58">one per agent tab · starts on first use</text>
  <line x1="240" y1="152" x2="240" y2="190" stroke="#2f6f9f" stroke-width="2.5" marker-start="url(#hB)" marker-end="url(#hB)"/>
  <line x1="600" y1="152" x2="600" y2="190" stroke="#2f6f9f" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#hB)" marker-end="url(#hB)"/>
  <line x1="960" y1="152" x2="960" y2="190" stroke="#8a877c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="252" y="177" font-size="12" style="fill:#1f4f73">each Talker to its own agent</text>

  <!-- Hub -->
  <rect x="40" y="194" width="1120" height="290" rx="14" fill="#efeaf7" stroke="#6b4fa0" stroke-width="3"/>
  <text x="600" y="224" text-anchor="middle" font-weight="800" font-size="20" style="fill:#4b3577">Agent Hub</text>

  <rect x="64" y="240" width="250" height="226" rx="10" fill="#fff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="189" y="266" text-anchor="middle" font-weight="800" font-size="15">Tabs · side panel</text>
  <rect x="94" y="282" width="190" height="34" rx="6" fill="#d9f0ea" stroke="#0f7b6c" stroke-width="2.5"/>
  <text x="189" y="304" text-anchor="middle" font-size="14" font-weight="700" style="fill:#0b5c51">Main Assistant</text>
  <rect x="94" y="326" width="190" height="34" rx="6" fill="#fcefdc" stroke="#c77d1a" stroke-width="2"/>
  <text x="170" y="348" text-anchor="middle" font-size="14" font-weight="700">Job agent</text>
  <circle cx="262" cy="343" r="11" fill="#b3261e"/><text x="262" y="348" text-anchor="middle" font-size="15" font-weight="800" style="fill:#fff">!</text>
  <rect x="94" y="370" width="190" height="34" rx="6" fill="#f2f1ee" stroke="#8a877c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="189" y="392" text-anchor="middle" font-size="14" style="fill:#5f5e58">next agent…</text>
  <text x="189" y="436" text-anchor="middle" font-size="13">Talker + agent each · own chat</text>
  <text x="189" y="454" text-anchor="middle" font-size="13" style="fill:#5f5e58">click a tab to set the focus</text>

  <rect x="338" y="240" width="250" height="226" rx="10" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
  <text x="463" y="266" text-anchor="middle" font-weight="800" font-size="15">Focus</text>
  <text x="463" y="290" text-anchor="middle" font-size="13">which tab you're in</text>
  <rect x="368" y="302" width="190" height="38" rx="19" fill="#d9f0ea" stroke="#0f7b6c" stroke-width="2.5"/>
  <text x="463" y="326" text-anchor="middle" font-size="14" font-weight="700" style="fill:#0b5c51">Main Assistant</text>
  <text x="463" y="370" text-anchor="middle" font-size="13">set by a tab click, by voice,</text>
  <text x="463" y="388" text-anchor="middle" font-size="13">or by saying yes to a suggestion</text>
  <text x="463" y="436" text-anchor="middle" font-size="13" style="fill:#5f5e58">voice goes to</text>
  <text x="463" y="454" text-anchor="middle" font-size="13" style="fill:#5f5e58">the tab you're in</text>

  <rect x="612" y="240" width="250" height="226" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/>
  <text x="737" y="266" text-anchor="middle" font-weight="800" font-size="15" style="fill:#b3261e">Held questions · cards</text>
  <rect x="632" y="282" width="210" height="52" rx="8" fill="#fbe9e7" stroke="#b3261e"/>
  <text x="646" y="303" font-size="13" font-weight="800" style="fill:#b3261e">! Job agent</text>
  <text x="646" y="323" font-size="13">"Apply to this one first?"</text>
  <rect x="632" y="342" width="210" height="34" rx="8" fill="#fff3a8" stroke="#c9a800"/>
  <text x="737" y="364" text-anchor="middle" font-size="13">card: use Chrome? (job agent)</text>
  <text x="737" y="400" text-anchor="middle" font-size="13">questions and finished work</text>
  <text x="737" y="418" text-anchor="middle" font-size="13">wait until you open that tab</text>
  <text x="737" y="436" text-anchor="middle" font-size="13" style="fill:#5f5e58">a question's task waits too</text>
  <text x="737" y="454" text-anchor="middle" font-size="13" style="fill:#5f5e58">nothing shows in the main chat</text>

  <rect x="886" y="240" width="250" height="226" rx="10" fill="#fff" stroke="#6f6d66" stroke-width="2"/>
  <text x="1011" y="266" text-anchor="middle" font-weight="800" font-size="15">Milestone feed</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="906" y="298" style="font-family:Consolas,monospace">job: sweep started</text>
    <text x="906" y="320" style="font-family:Consolas,monospace">job: 24 found, 12 fit</text>
    <text x="906" y="342" style="font-family:Consolas,monospace">job: 3 applied, 2 to check</text>
  </g>
  <text x="1011" y="400" text-anchor="middle" font-size="13">one STATUS line per big step</text>
  <text x="1011" y="418" text-anchor="middle" font-size="13">read by the Main Assistant</text>
  <text x="1011" y="436" text-anchor="middle" font-size="13">at its next turn</text>
  <text x="1011" y="454" text-anchor="middle" font-size="13" style="fill:#5f5e58">never said, never in your chat</text>

  <!-- Agents -->
  <line x1="240" y1="484" x2="240" y2="520" stroke="#6f6d66" stroke-width="2" marker-start="url(#hG)" marker-end="url(#hG)"/>
  <line x1="600" y1="484" x2="600" y2="520" stroke="#6f6d66" stroke-width="2" marker-start="url(#hG)" marker-end="url(#hG)"/>
  <line x1="960" y1="484" x2="960" y2="520" stroke="#8a877c" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="110" y="522" width="260" height="72" rx="10" fill="#d9f0ea" stroke="#0f7b6c" stroke-width="4"/>
  <text x="240" y="546" text-anchor="middle" font-weight="800" font-size="16" style="fill:#0b5c51">Main Assistant</text>
  <text x="240" y="566" text-anchor="middle" font-size="13" font-weight="700" style="fill:#0b5c51">main agent · coordinates</text>
  <text x="240" y="584" text-anchor="middle" font-size="13">the one you mostly talk to</text>
  <rect x="470" y="522" width="260" height="72" rx="10" fill="#fcefdc" stroke="#c77d1a" stroke-width="2"/>
  <text x="600" y="546" text-anchor="middle" font-weight="800" font-size="16">Job agent</text>
  <text x="600" y="566" text-anchor="middle" font-size="13" font-weight="700" style="fill:#8a5410">specialist · owns job_search</text>
  <text x="600" y="584" text-anchor="middle" font-size="13">not a second main agent</text>
  <rect x="830" y="522" width="260" height="72" rx="10" fill="#f2f1ee" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="960" y="546" text-anchor="middle" font-weight="800" font-size="16" style="fill:#5f5e58">Next big agent (later)</text>
  <text x="960" y="566" text-anchor="middle" font-size="13" font-weight="700" style="fill:#5f5e58">specialist · owns its module</text>
  <text x="960" y="584" text-anchor="middle" font-size="13" style="fill:#5f5e58">e.g. Unity · reports to the MA too</text>

  <line x1="468" y1="558" x2="374" y2="558" stroke="#6f6d66" stroke-width="2.5" marker-end="url(#hG)"/>
  <text x="420" y="548" text-anchor="middle" font-size="12" font-weight="700" style="fill:#3d3c38">STATUS</text>
  <text x="420" y="576" text-anchor="middle" font-size="12" style="fill:#5f5e58">always</text>
</svg>
