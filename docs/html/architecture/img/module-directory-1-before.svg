<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Arial, sans-serif">
  <!-- Source for docs/architecture/modules.md. Drawn by hand; the build copies it. -->
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b8a52"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a877c"/></marker>
  </defs>
  <style>
    text { fill: #1d1d1b; }
    .wt { fill: #fff; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .menu { fill: #fff4cc; stroke: #c9a227; stroke-width: 2; }
    .mh { font-size: 13px; font-weight: 800; text-anchor: middle; fill: #7a5d00; }
    .mi { font-size: 13px; fill: #3a3000; }
    .sm { font-size: 13px; fill: #5f5e58; }
    .lb { font-size: 16px; font-weight: 600; fill: #1d1d1b; }
    .big { font-size: 22px; font-weight: 800; }
    .gT { font-size: 14px; font-weight: 700; fill: #2a6b3c; }
    .kT { font-size: 13px; fill: #8a877c; }
  </style>
  <rect width="1200" height="520" rx="16" fill="#ffffff"/>

  <rect x="40" y="70" width="190" height="64" rx="14" fill="#e3f1e6" stroke="#3b8a52" stroke-width="3"/>
  <text x="135" y="109" text-anchor="middle" class="lb">💬 Talker</text>
  <rect x="40" y="340" width="190" height="64" rx="14" fill="#e3f1e6" stroke="#3b8a52" stroke-width="3"/>
  <text x="135" y="368" text-anchor="middle" class="lb">🛠 Main</text>
  <text x="135" y="390" text-anchor="middle" class="lb">Assistant</text>
  <line x1="135" y1="138" x2="135" y2="336" stroke="#3b8a52" stroke-width="2" marker-start="url(#aG)" marker-end="url(#aG)"/>
  <text x="145" y="225" class="sm">work ↓</text>
  <text x="145" y="245" class="sm">progress,</text>
  <text x="145" y="263" class="sm">questions ↑</text>

  <path d="M232,92 C450,10 760,10 965,146" fill="none" stroke="#3b8a52" stroke-width="5" marker-end="url(#aG)"/>
  <text x="590" y="82" text-anchor="middle" class="gT" style="font-size:16px">hardcoded: viewer.open / viewer.highlight</text>

  <circle cx="560" cy="270" r="150" fill="#efeaf7" stroke="#6b4fa0" stroke-width="3"/>
  <text x="560" y="150" text-anchor="middle" class="big" style="fill:#3a2f5c">Core</text>
  <g opacity="0.45">
    <rect x="455" y="175" width="210" height="150" rx="12" fill="#e4e3df" stroke="#aaa" stroke-width="2"/>
    <rect x="470" y="188" width="140" height="34" rx="7" fill="#fff" stroke="#999" stroke-width="2" transform="rotate(-6 540 205)"/>
    <text x="482" y="207" class="mi" transform="rotate(-6 540 205)">viewer.open</text>
    <rect x="505" y="222" width="145" height="34" rx="7" fill="#fff" stroke="#999" stroke-width="2" transform="rotate(5 577 239)"/>
    <text x="517" y="244" class="mi" transform="rotate(5 577 239)">viewer.highlight</text>
    <rect x="474" y="262" width="140" height="34" rx="7" fill="#fff" stroke="#999" stroke-width="2" transform="rotate(-3 544 279)"/>
    <text x="486" y="284" class="mi" transform="rotate(-3 544 279)">viewer.tabs</text>
  </g>
  <text x="560" y="350" text-anchor="middle" class="kT" style="font-size:15px;font-weight:700">flat list · old way</text>

  <rect x="440" y="440" width="120" height="36" rx="18" fill="#f2f1ee" stroke="#aaa" stroke-width="2"/>
  <text x="500" y="463" text-anchor="middle" class="kT" style="font-weight:700">✕ no directory</text>
  <rect x="572" y="440" width="140" height="36" rx="18" fill="#f2f1ee" stroke="#aaa" stroke-width="2"/>
  <text x="642" y="463" text-anchor="middle" class="kT" style="font-weight:700">✕ no one-liners</text>

  <line x1="234" y1="360" x2="408" y2="300" stroke="#aaa" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="322" y="340" text-anchor="middle" style="font-size:34px;font-weight:800;fill:#b33">✕</text>
  <text x="322" y="300" text-anchor="middle" class="kT" style="font-weight:700">can't call tools</text>

  <line x1="200" y1="406" x2="236" y2="448" stroke="#8a877c" stroke-width="2" marker-end="url(#aK)"/>
  <rect x="240" y="440" width="150" height="40" rx="20" fill="#fff" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="315" y="465" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#5f5e58">🏷 SHOW tag</text>
  <path d="M1015,314 C1015,500 760,505 394,462" fill="none" stroke="#8a877c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aK)"/>
  <text x="900" y="500" text-anchor="middle" class="kT" style="font-weight:700">tags only · viewer watches 👀</text>

  <g transform="translate(900,150)">
    <rect width="230" height="160" rx="20" fill="#2f6f9f"/>
    <text x="115" y="22" class="wt">html_viewer</text>
    <rect x="14" y="32" width="202" height="114" rx="12" fill="#fff"/>
    <text x="50" y="88" font-size="30" text-anchor="middle">🖼</text>
    <text x="50" y="114" class="sm" text-anchor="middle">work</text>
    <rect x="92" y="40" width="116" height="98" rx="8" class="menu"/>
    <text x="150" y="58" class="mh">MENU</text>
    <text x="104" y="82" class="mi">• open</text>
    <text x="104" y="104" class="mi">• highlight</text>
    <text x="104" y="126" class="mi">• tabs</text>
  </g>
</svg>
